# ============================================================================
# Falco Runtime Security Monitoring
# Docker Compose Configuration
# ============================================================================

services:
  # ==========================================================================
  # Falco - Runtime Security Monitoring
  # ==========================================================================
  falco:
    image: falcosecurity/falco:0.37.0
    container_name: falco
    # Replaces `privileged: true` with the minimal capability set Falco needs to
    # load its eBPF probe and read kernel/syscall state. The modern_ebpf driver
    # loads via the BPF/PERFMON capabilities, so SYS_ADMIN is intentionally NOT
    # granted here (it would re-expand the host control surface). SYS_RESOURCE
    # raises the locked-memory limit for the BPF maps; SYS_PTRACE supports
    # process introspection for alert enrichment.
    cap_add:
      - SYS_PTRACE
      - SYS_RESOURCE
      - BPF
      - PERFMON
    security_opt:
      - "no-new-privileges:true"
    volumes:
      # Residual-risk acceptance: the docker.sock mount (read-only) is retained
      # for container.* metadata enrichment of alerts. Read-only access still
      # exposes the Docker API for enumeration; this is an accepted trade-off for
      # alert context and is scoped to the isolated complyeasy-security network.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
      # Config and rules
      - ./falco.yaml:/etc/falco/falco.yaml:ro
      - ./complyeasy_rules.yaml:/etc/falco/complyeasy_rules.yaml:ro
      # Output logs
      - falco_logs:/var/log/falco
    environment:
      # Use eBPF driver instead of kernel module
      - FALCO_BPF_PROBE=
    networks:
      - complyeasy-security
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "falco", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Falco Sidekick - Alert Router
  # ==========================================================================
  falco-sidekick:
    image: falcosecurity/falcosidekick:2.28.0
    container_name: falco-sidekick
    environment:
      # Elasticsearch output
      - ELASTICSEARCH_HOSTPORT=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=falco-alerts
      - ELASTICSEARCH_TYPE=_doc
      - ELASTICSEARCH_MINIMUMPRIORITY=warning
      # Slack notifications: fail-closed so a missing webhook errors at startup
      # rather than silently dropping security alerts.
      - SLACK_WEBHOOKURL=${SLACK_SECURITY_WEBHOOK_URL:?SLACK_SECURITY_WEBHOOK_URL is required for security alerting}
      - SLACK_MINIMUMPRIORITY=warning
      # Custom webhook to ComplyEasy API
      - WEBHOOK_ADDRESS=http://api:3001/api/v1/security/falco-alerts
      - WEBHOOK_MINIMUMPRIORITY=warning
      # SMTP for email alerts: fail-closed on every credential so an unset alert
      # channel errors at startup instead of silently disabling critical alerts.
      - SMTP_HOSTPORT=${SMTP_HOST:?SMTP_HOST is required for security alerting}:${SMTP_PORT:?SMTP_PORT is required for security alerting}
      - SMTP_USER=${SMTP_USER:?SMTP_USER is required for security alerting}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD is required for security alerting}
      - SMTP_FROM=security@complyeasy.ai
      - SMTP_TO=${SECURITY_ALERT_EMAIL:?SECURITY_ALERT_EMAIL is required for security alerting}
      - SMTP_MINIMUMPRIORITY=critical
    # Bound to loopback: Falco pushes events to sidekick over the internal
    # network; the host publish is for local debugging only.
    ports:
      - "127.0.0.1:2801:2801"
    depends_on:
      - falco
    networks:
      - complyeasy-security
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2801/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Falco Exporter - Prometheus Metrics
  # ==========================================================================
  falco-exporter:
    image: falcosecurity/falco-exporter:0.8.3
    container_name: falco-exporter
    environment:
      - FALCO_GRPC_ADDR=falco:5060
    # Bound to loopback: Prometheus scrapes the exporter over the internal
    # network; the host publish is for local debugging only.
    ports:
      - "127.0.0.1:9376:9376"
    depends_on:
      - falco
    networks:
      - complyeasy-security
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9376/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  falco_logs:
    driver: local

networks:
  complyeasy-security:
    driver: bridge
    external: true
