# AWS Secrets Manager Rotation Configuration
# Deploy with: aws cloudformation deploy --template-file secrets-rotation.yaml --stack-name complyeasy-secrets-rotation

AWSTemplateFormatVersion: '2010-09-09'
Description: 'ComplyEasyAI - Secrets Manager Rotation Configuration'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production

  RotationLambdaArn:
    Type: String
    Description: ARN of the rotation Lambda function

  JWTRotationDays:
    Type: Number
    Default: 90
    Description: Number of days between JWT secret rotations

  DatabaseRotationDays:
    Type: Number
    Default: 30
    Description: Number of days between database credential rotations

  ApiKeyRotationDays:
    Type: Number
    Default: 90
    Description: Number of days between API key rotations

Resources:
  # ============================================================================
  # JWT SECRETS
  # ============================================================================
  JWTSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'complyeasy/${Environment}/jwt'
      Description: 'JWT signing secrets for ComplyEasyAI'
      Tags:
        - Key: SecretType
          Value: jwt
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ComplyEasyAI
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: 'secret'
        PasswordLength: 64
        ExcludeCharacters: '"@/\'

  JWTSecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: JWTSecret
    Properties:
      SecretId: !Ref JWTSecret
      RotationLambdaARN: !Ref RotationLambdaArn
      RotationRules:
        AutomaticallyAfterDays: !Ref JWTRotationDays
        ScheduleExpression: !Sub 'rate(${JWTRotationDays} days)'

  # ============================================================================
  # DATABASE CREDENTIALS
  # ============================================================================
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'complyeasy/${Environment}/database'
      Description: 'Database credentials for ComplyEasyAI'
      Tags:
        - Key: SecretType
          Value: database
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ComplyEasyAI
      SecretString: !Sub |
        {
          "host": "{{resolve:ssm:/complyeasy/${Environment}/database/host}}",
          "port": 5432,
          "database": "postgres",
          "username": "postgres",
          "password": "PLACEHOLDER_CHANGE_ME",
          "ssl": true
        }

  DatabaseSecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: DatabaseSecret
    Properties:
      SecretId: !Ref DatabaseSecret
      RotationLambdaARN: !Ref RotationLambdaArn
      RotationRules:
        AutomaticallyAfterDays: !Ref DatabaseRotationDays
        ScheduleExpression: !Sub 'rate(${DatabaseRotationDays} days)'

  # ============================================================================
  # ENCRYPTION KEYS
  # ============================================================================
  EncryptionKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'complyeasy/${Environment}/encryption'
      Description: 'Encryption keys for ComplyEasyAI'
      Tags:
        - Key: SecretType
          Value: encryption_key
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ComplyEasyAI
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: 'key'
        PasswordLength: 64
        ExcludeCharacters: '"@/\'''

  EncryptionKeyRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: EncryptionKeySecret
    Properties:
      SecretId: !Ref EncryptionKeySecret
      RotationLambdaARN: !Ref RotationLambdaArn
      RotationRules:
        AutomaticallyAfterDays: 180  # 6 months for encryption keys
        ScheduleExpression: 'rate(180 days)'

  # ============================================================================
  # API KEYS (Gemini, SendGrid, Stripe, etc.)
  # ============================================================================
  GeminiApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'complyeasy/${Environment}/gemini'
      Description: 'Google Gemini API key'
      Tags:
        - Key: SecretType
          Value: api_key
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ComplyEasyAI
      SecretString: '{"key": "PLACEHOLDER_CHANGE_ME"}'

  StripeApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'complyeasy/${Environment}/stripe'
      Description: 'Stripe API keys'
      Tags:
        - Key: SecretType
          Value: api_key
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ComplyEasyAI
      SecretString: |
        {
          "secretKey": "PLACEHOLDER_CHANGE_ME",
          "publishableKey": "PLACEHOLDER_CHANGE_ME",
          "webhookSecret": "PLACEHOLDER_CHANGE_ME"
        }

  SendGridApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'complyeasy/${Environment}/sendgrid'
      Description: 'SendGrid API key'
      Tags:
        - Key: SecretType
          Value: api_key
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ComplyEasyAI
      SecretString: '{"key": "PLACEHOLDER_CHANGE_ME"}'

  # ============================================================================
  # ROTATION LAMBDA PERMISSIONS
  # ============================================================================
  RotationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RotationLambdaArn
      Action: lambda:InvokeFunction
      Principal: secretsmanager.amazonaws.com
      SourceArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:complyeasy/${Environment}/*'

Outputs:
  JWTSecretArn:
    Description: ARN of the JWT secret
    Value: !Ref JWTSecret
    Export:
      Name: !Sub '${AWS::StackName}-JWTSecretArn'

  DatabaseSecretArn:
    Description: ARN of the database secret
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseSecretArn'

  EncryptionKeySecretArn:
    Description: ARN of the encryption key secret
    Value: !Ref EncryptionKeySecret
    Export:
      Name: !Sub '${AWS::StackName}-EncryptionKeySecretArn'
