# Grafana datasource provisioning for ComplyEasyAI
# Auto-loaded by Grafana from /etc/grafana/provisioning/datasources
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
