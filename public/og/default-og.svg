<!--
  ComplyEasy AI default social card (1200x630).
  A PNG export at /og/default-og.png is recommended for maximum
  social-platform compatibility (some platforms do not render SVG OG images).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ComplyEasy AI — AI Compliance Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="0.5" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle dot texture -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="1050" cy="120" r="180"/>
    <circle cx="180" cy="540" r="140"/>
  </g>

  <!-- Shield + checkmark mark -->
  <g transform="translate(96 215)">
    <path d="M100 0 200 38v75c0 63-42 104-100 121C42 217 0 176 0 113V38z" fill="url(#shield)"/>
    <path d="M58 113 90 145 145 78" fill="none" stroke="#042f2e" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="360" y="300" font-family="Inter, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff">ComplyEasy AI</text>
  <text x="362" y="372" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="500" fill="#ccfbf1">AI Compliance Automation for SOC 2, ISO 27001,</text>
  <text x="362" y="420" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="500" fill="#ccfbf1">GDPR &amp; the EU AI Act</text>

  <!-- Footer URL -->
  <text x="362" y="500" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#5eead4">complyeasyai.com</text>
</svg>
