<!--
  ComplyEasyAI default social card (1200x630), in the Signal design system:
  #07090D canvas, #38E8A6 green accent, #3AA0FF blue. Social platforms do not
  render SVG og:image, so pages point at /og/default-og.png, which
  scripts/render-og-image.mjs renders from this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ComplyEasyAI: AI compliance automation that runs itself">
  <defs>
    <radialGradient id="glow-blue" cx="0.82" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#3AA0FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3AA0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="0.06" cy="0.96" r="0.6">
      <stop offset="0" stop-color="#38E8A6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38E8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38E8A6"/>
      <stop offset="1" stop-color="#3AA0FF"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#07090D"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow-blue)"/>
  <rect width="1200" height="630" fill="url(#glow-green)"/>

  <!-- Logo mark + wordmark -->
  <g transform="translate(88 84)">
    <rect width="56" height="56" rx="15" fill="url(#mark)"/>
    <rect x="17" y="17" width="22" height="22" rx="5" fill="none" stroke="#07090D" stroke-width="4.5"/>
    <text x="76" y="40" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#F4F6FA">ComplyEasy<tspan fill="#38E8A6">AI</tspan></text>
  </g>

  <!-- Eyebrow pill -->
  <g transform="translate(88 206)">
    <rect width="372" height="42" rx="21" fill="#38E8A6" fill-opacity="0.06" stroke="#38E8A6" stroke-opacity="0.32"/>
    <circle cx="26" cy="21" r="5" fill="#38E8A6"/>
    <text x="44" y="27" font-family="'IBM Plex Mono', Menlo, monospace" font-size="16" font-weight="500" letter-spacing="2.6" fill="#38E8A6">AUTONOMOUS COMPLIANCE OS</text>
  </g>

  <!-- Headline -->
  <text font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-2" fill="#F4F6FA">
    <tspan x="84" y="344">AI compliance automation</tspan>
    <tspan x="84" y="428">that runs <tspan fill="#38E8A6">itself.</tspan></tspan>
  </text>

  <!-- Frameworks + URL -->
  <text x="88" y="522" font-family="'IBM Plex Mono', Menlo, monospace" font-size="21" letter-spacing="1.2" fill="#9AA4B5">SOC 2 · ISO 27001 · GDPR · HIPAA · EU AI Act · DORA</text>
  <text x="88" y="566" font-family="'IBM Plex Mono', Menlo, monospace" font-size="21" font-weight="500" letter-spacing="1.2" fill="#38E8A6">www.complyeasyai.com</text>
</svg>
