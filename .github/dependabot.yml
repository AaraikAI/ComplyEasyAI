version: 2
updates:
  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
    # Majors are deliberately kept OUT of the groups. A grouped PR is
    # all-or-nothing, so one breaking major makes the whole batch unmergeable:
    # #420 bundled 47 routine AWS SDK patches with stripe 21->22 and
    # googleapis 171->176, and failed Lint & Type Check on the two majors,
    # blocking every patch in the group. Excluding majors here does NOT ignore
    # them - Dependabot opens an individual PR per major, which is what a
    # breaking change deserves.
    #
    # The one exception is the vitest family. vitest, @vitest/ui and
    # @vitest/coverage-v8 pin each other to the exact same version through
    # peerDependencies, so none of them can be installed on its own: the 5.0.0
    # majors arrived as three separate PRs (#516, #517, #519) and each one
    # failed Lint & Type Check. The `vitest` group takes every update type,
    # majors included, so the family always lands in a single PR. It must stay
    # FIRST: Dependabot assigns a dependency to the first group it matches.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
          - "vitest"
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps):"

  # Server dependencies
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # ioredis 6.0.0 (#532) switches String.prototype to V8 dictionary mode
      # as soon as it is loaded (its RESP3 decoder declares
      # `class VerbatimString extends String`), which slows string code in the
      # whole process: escape-html ran 117k -> 37k ops/s and a charCodeAt loop
      # about 10x slower on Node 22 here. Fixed upstream by redis/ioredis#2206
      # (merged 2026-09-28), not released yet. Only 6.0.0 is ignored, so the
      # next 6.x is proposed as usual. Taking it: tsc and a real-Redis smoke
      # of the cache and BullMQ paths already pass on 6.0.0; RESP3 becomes the
      # default protocol (`protocol: 2` keeps the v5 wire format).
      - dependency-name: "ioredis"
        versions: ["6.0.0"]
    # Majors are deliberately kept OUT of the groups. A grouped PR is
    # all-or-nothing, so one breaking major makes the whole batch unmergeable:
    # #420 bundled 47 routine AWS SDK patches with stripe 21->22 and
    # googleapis 171->176, and failed Lint & Type Check on the two majors,
    # blocking every patch in the group. Excluding majors here does NOT ignore
    # them - Dependabot opens an individual PR per major, which is what a
    # breaking change deserves.
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
          - "jest*"
          - "ts-jest"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps):"

  # Docker images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # The node base image stays on an LTS line (see the Dockerfile base stage,
    # NODE_VERSION in ci.yml and "engines"). Under the release model that ends
    # with Node 26, odd majors never enter LTS and are dropped once the next
    # even major ships, so Dependabot must not propose them (#535 proposed
    # node:25-alpine). From Node 27 every major is promoted to LTS in the
    # October after its April release (nodejs.org, "Evolving the Node.js
    # Release Schedule"), so 27+ is deliberately not ignored; merge such a
    # proposal only after that promotion. Docker ignore ranges use Bundler
    # requirement syntax: "~> 23.0" matches every 23.x tag, including "23-alpine".
    ignore:
      - dependency-name: "node"
        versions: ["~> 23.0", "~> 25.0"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # github/codeql-action/{init,analyze,upload-sarif} MUST move together.
    # CodeQL refuses to run when init and analyze are on different versions:
    #   "Loaded a configuration file for version '4.36.3', but running
    #    version '4.37.8'"
    # Ungrouped, Dependabot opens one PR per action path, so `analyze` bumps
    # while `init` stays behind and both Analyze jobs fail - which is what
    # happened to #340 and again to #434. Grouping them makes every
    # codeql-action bump a single, mergeable PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci):"

  # Mobile dependencies
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      - dependency-name: "jest"
        versions: [">=30.0.0"]
      - dependency-name: "@types/jest"
        versions: [">=30.0.0"]
      # RNTL v14 requires the new React-19 `test-renderer`, but jest-expo 56 /
      # @react-native/jest-preset 0.85 still wire the legacy `react-test-renderer`
      # and don't register the RN host config for the new renderer. Forcing v14
      # nulls the render tree for hooks using mount-guard refs (useApi family).
      # Hold the major until jest-expo's preset adopts the new renderer.
      - dependency-name: "@testing-library/react-native"
        versions: [">=14.0.0"]
      # @react-native/jest-preset must track the react-native version exactly;
      # Dependabot proposes it ahead of react-native (e.g. 0.86 while RN is 0.85),
      # which breaks the mobile jest preset. Hold it until react-native moves.
      - dependency-name: "@react-native/jest-preset"
        versions: [">=0.86.0"]
      # react-native itself is part of the same coupling: Expo SDK 56 pairs
      # with react-native 0.85, and the 0.87 PR (#469) failed mobile tsc on RN's
      # stricter ListEmptyComponent / TextInput ref types. Take react-native
      # together with the Expo SDK 57 migration below, not on its own.
      - dependency-name: "react-native"
        versions: [">=0.86.0"]
      # react and react-test-renderer are pinned to the exact React version
      # that react-native's bundled renderer is built from, and move only
      # together with react-native / the Expo SDK. react-native 0.85.3 ships
      # renderers built from React 19.2.3 (Libraries/Renderer/implementations/*:
      # version "19.2.3"), Expo SDK 56's bundledNativeModules.json pins
      # "react": "19.2.3", and jest-expo 56 depends on react-test-renderer
      # 19.2.3 exactly.
      #
      # This is an exact-version requirement, not a range: the legacy
      # ReactNativeRenderer throws "Incompatible React versions" at module
      # load unless React.version === "19.2.3", and react-native still loads
      # it lazily in a Fabric/bridgeless app - RendererImplementation.js
      # routes findNodeHandle, unstable_batchedUpdates and
      # sendAccessibilityEvent through it, and a native-driver animation
      # reaches findNodeHandle via AnimatedProps#connectAnimatedView (e.g. the
      # first press on a bottom-tab item on iOS: react-navigation's
      # PlatformPressable animates opacity with useNativeDriver). So a react
      # patch (19.2.8) breaks the app exactly like a minor (19.3.0, #512). The jest
      # suite cannot catch it: react-test-renderer has no such check and
      # @react-native/jest-preset replaces RendererProxy with a jest mock
      # (jest/setup.js), so #511 went green.
      #
      # Ignore every react / react-test-renderer update above the renderer's
      # version. When react-native or the Expo SDK moves, set both packages
      # to the React version of its Libraries/Renderer/implementations/* and
      # update these two ranges in the same PR.
      - dependency-name: "react"
        versions: [">19.2.3"]
      - dependency-name: "react-test-renderer"
        versions: [">19.2.3"]
      # Type packages carry no runtime check; only the 19.3 minor (types for
      # APIs the 19.2.3 renderer does not implement) is held.
      - dependency-name: "@types/react"
        versions: [">=19.3.0"]
      - dependency-name: "@types/react-test-renderer"
        versions: [">=19.3.0"]
      # Native modules that the Expo SDK pins move with the SDK, not on their
      # own: Expo SDK 56's bundledNativeModules.json expects
      # react-native-screens ~4.26.0, and a newer minor ships native code the
      # SDK was not built and tested against (#576 proposed 4.28.0). Patch
      # releases stay allowed; take minors and majors with `npx expo install
      # --fix` during the SDK migration.
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Expo SDK 57 is a coordinated SDK migration, not a dependency bump. The
      # tree is coherently on SDK 56 - expo, expo-secure-store, expo-status-bar
      # and jest-expo all 56.x against react-native 0.85.3 with a matching
      # @react-native/jest-preset. Dependabot proposes the family piecemeal
      # (#436 expo, #431 jest-expo, #433 expo-status-bar -> 57, while
      # expo-secure-store stays on 56), and expo's peerDependencies are all "*",
      # so npm cannot reject the mismatched tree - it surfaces at runtime. The
      # 55->56 bump with jest-expo left behind threw "Super expression must
      # either be null or a function".
      #
      # Empirically: #431 (jest-expo 57 against expo 56) failed CI, but #436
      # (expo 57 alone) PASSED - which is the more dangerous case, because
      # Build iOS and Build Android are skipped on PRs, so no native build ever
      # validates an SDK major. Green checks are not evidence here.
      #
      # Hold the whole family until an SDK 57 migration is done deliberately:
      # every expo-* package, react-native and @react-native/jest-preset moved
      # together, with a native build and device testing.
      - dependency-name: "expo"
        versions: [">=57.0.0"]
      - dependency-name: "expo-status-bar"
        versions: [">=57.0.0"]
      - dependency-name: "expo-secure-store"
        versions: [">=57.0.0"]
      - dependency-name: "jest-expo"
        versions: [">=57.0.0"]
    commit-message:
      prefix: "chore(deps):"
