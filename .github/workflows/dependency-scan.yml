name: Dependency Vulnerability Scan

on:
  schedule:
    # Every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install server dependencies
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Audit root dependencies
        id: audit_root
        continue-on-error: true
        run: |
          npm audit --json > /tmp/root-audit.json 2>&1 || true
          HIGH_COUNT=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "high" or .value.severity == "critical")] | length' /tmp/root-audit.json 2>/dev/null || echo "0")
          echo "high_count=$HIGH_COUNT" >> "$GITHUB_OUTPUT"

      - name: Audit server dependencies
        id: audit_server
        continue-on-error: true
        working-directory: server
        run: |
          npm audit --json > /tmp/server-audit.json 2>&1 || true
          HIGH_COUNT=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "high" or .value.severity == "critical")] | length' /tmp/server-audit.json 2>/dev/null || echo "0")
          echo "high_count=$HIGH_COUNT" >> "$GITHUB_OUTPUT"

      - name: Create issue if vulnerabilities found
        if: steps.audit_root.outputs.high_count > 0 || steps.audit_server.outputs.high_count > 0
        uses: actions/github-script@v8
        with:
          script: |
            const rootCount = parseInt('${{ steps.audit_root.outputs.high_count }}') || 0;
            const serverCount = parseInt('${{ steps.audit_server.outputs.high_count }}') || 0;
            const total = rootCount + serverCount;

            const body = `## Dependency Vulnerability Scan Results

            **Date:** ${new Date().toISOString().split('T')[0]}
            **HIGH/CRITICAL vulnerabilities found:** ${total}

            - Root dependencies: ${rootCount} high/critical
            - Server dependencies: ${serverCount} high/critical

            ### Next Steps
            1. Run \`npm audit\` locally to review details
            2. Run \`npm audit fix\` to apply non-breaking fixes
            3. Review breaking changes manually

            _This issue was automatically created by the weekly dependency scan._`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] ${total} HIGH/CRITICAL dependency vulnerabilities found`,
              body: body,
              labels: ['security', 'dependencies'],
            });

      - name: Attempt auto-fix
        if: steps.audit_root.outputs.high_count > 0 || steps.audit_server.outputs.high_count > 0
        run: |
          npm audit fix --force 2>/dev/null || true
          cd server && npm audit fix --force 2>/dev/null || true
