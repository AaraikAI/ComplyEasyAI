name: Dependency Vulnerability Scan

on:
  schedule:
    # Every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Least-privilege default; the scan job grants the extra writes it needs to
# open a tracking issue.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install server dependencies
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Audit root dependencies
        id: audit_root
        # `npm audit` exits non-zero when advisories exist; this step only
        # collects a count and opens a tracking issue, so a non-zero audit
        # exit must not fail the step. stderr is kept on the console (no 2>&1
        # swallow) so genuine tooling errors stay visible in the logs.
        run: |
          npm audit --json > /tmp/root-audit.json || true
          HIGH_COUNT=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "high" or .value.severity == "critical")] | length' /tmp/root-audit.json || echo "0")
          echo "high_count=$HIGH_COUNT" >> "$GITHUB_OUTPUT"

      - name: Audit server dependencies
        id: audit_server
        working-directory: server
        run: |
          npm audit --json > /tmp/server-audit.json || true
          HIGH_COUNT=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "high" or .value.severity == "critical")] | length' /tmp/server-audit.json || echo "0")
          echo "high_count=$HIGH_COUNT" >> "$GITHUB_OUTPUT"

      - name: Create issue if vulnerabilities found
        if: steps.audit_root.outputs.high_count > 0 || steps.audit_server.outputs.high_count > 0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const rootCount = parseInt('${{ steps.audit_root.outputs.high_count }}') || 0;
            const serverCount = parseInt('${{ steps.audit_server.outputs.high_count }}') || 0;
            const total = rootCount + serverCount;

            const body = `## Dependency Vulnerability Scan Results

            **Date:** ${new Date().toISOString().split('T')[0]}
            **HIGH/CRITICAL vulnerabilities found:** ${total}

            - Root dependencies: ${rootCount} high/critical
            - Server dependencies: ${serverCount} high/critical

            ### Next Steps
            1. Run \`npm audit\` locally to review details
            2. Run \`npm audit fix\` to apply non-breaking fixes
            3. Review breaking changes manually

            _This issue was automatically created by the weekly dependency scan._`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] ${total} HIGH/CRITICAL dependency vulnerabilities found`,
              body: body,
              labels: ['security', 'dependencies'],
            });
      # NOTE: no unattended `npm audit fix --force` here — a forced fix can pull
      # in breaking major upgrades without review. Remediation is handled by
      # Dependabot PRs and the tracking issue opened above.
