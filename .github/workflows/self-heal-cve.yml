# Self-healing dependency / CVE loop.
#
# Daily: audit root + server + mobile, apply ONLY non-breaking fixes
# (`npm audit fix`, no --force), verify the lockfile actually changed, and open a
# PR. The PR is set to auto-merge — GitHub merges it ONLY after the full required
# CI pipeline (build/lint/test/E2E/security) passes, so nothing lands unverified.
# Breaking / no-clean-fix advisories never auto-apply; they open a tracking issue
# for human review. This is the "auto-merge safe, PR the rest" contract.
name: Self-Heal CVEs

on:
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC
  workflow_dispatch: {}

# Least privilege: only what this job needs.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: self-heal-cve
  cancel-in-progress: false

jobs:
  audit-and-fix:
    name: Audit & auto-fix dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20

      - name: Install root deps (for audit tooling)
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Generate audit report
        id: report
        run: |
          node scripts/self-improvement/audit-report.mjs --out "$RUNNER_TEMP/si"
          {
            echo "auto_fixable=$(node -e "console.log(require('$RUNNER_TEMP/si/audit-report.json').autoFixableCount)")"
            echo "breaking=$(node -e "console.log(require('$RUNNER_TEMP/si/audit-report.json').breakingCount)")"
          } >> "$GITHUB_OUTPUT"

      - name: Apply non-breaking fixes (root, server, mobile)
        id: fix
        run: |
          set -e
          changed=0
          for dir in . server mobile; do
            if [ -f "$dir/package.json" ]; then
              echo "::group::npm audit fix in $dir"
              ( cd "$dir" && npm audit fix --no-audit --package-lock-only || true )
              echo "::endgroup::"
            fi
          done
          # Did any lockfile/manifest actually change?
          if [ -n "$(git status --porcelain -- '*package.json' '*package-lock.json')" ]; then
            changed=1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Open auto-merge PR for non-breaking fixes
        if: steps.fix.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for L in "dependencies:0366d6" "security:b60205" "automerge:0e8a16"; do
            gh label create "${L%%:*}" --color "${L##*:}" 2>/dev/null || true
          done
          BRANCH="self-heal/cve-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "complyeasy-self-heal[bot]"
          git config user.email "self-heal@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- '*package.json' '*package-lock.json'
          git commit -m "fix(deps): auto-apply non-breaking security fixes" \
                     -m "Generated by the Self-Heal CVEs workflow (npm audit fix, no --force). Auto-merges only after the full CI pipeline passes."
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "fix(deps): automated non-breaking security fixes" \
            --body-file "$RUNNER_TEMP/si/audit-report.md" \
            --label "dependencies" --label "security" --label "automerge" \
            --base "${GITHUB_REF_NAME}" --head "$BRANCH")
          echo "Opened $PR_URL"
          # Auto-merge: GitHub completes the merge ONLY when all required checks pass.
          gh pr merge --auto --squash "$PR_URL" || \
            echo "::warning::Auto-merge could not be enabled (enable 'Allow auto-merge' in repo settings). PR left open for manual merge."

      - name: Open tracking issue for breaking advisories
        if: steps.report.outputs.breaking != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for L in "dependencies:0366d6" "security:b60205"; do
            gh label create "${L%%:*}" --color "${L##*:}" 2>/dev/null || true
          done
          TITLE="Security: $(node -e "console.log(require('$RUNNER_TEMP/si/audit-report.json').breakingCount)") advisory(ies) need a breaking upgrade"
          # De-dupe: update the existing open issue instead of stacking new ones.
          EXISTING=$(gh issue list --state open --label "security" --search "in:title breaking upgrade" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/si/audit-report.md"
          else
            gh issue create --title "$TITLE" \
              --body-file "$RUNNER_TEMP/si/audit-report.md" \
              --label "security" --label "dependencies"
          fi
