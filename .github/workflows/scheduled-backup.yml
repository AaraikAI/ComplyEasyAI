name: Scheduled Database Backup

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Override backup retention (days)'
        required: false
        default: '30'

# Least-privilege default for GITHUB_TOKEN; this workflow only reads the repo
# and talks to AWS via secrets.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  # MUST be a private bucket with no CloudFront origin. S3_FRONTEND_BUCKET is the
  # origin for the public website, so database dumps written there are served to
  # the internet to anyone who guesses the key.
  BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
  RETENTION_DAYS: ${{ github.event.inputs.retention_days || '30' }}

jobs:
  backup:
    name: Database Backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          # Supabase runs Postgres 17.x. pg_dump from older versions refuses to
          # dump newer servers, producing empty output. Install the matching
          # major from the PostgreSQL APT repo.
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Create database backup
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_TS=$(date -u +%Y%m%d_%H%M%S)
          BACKUP_KEY="backups/scheduled/${BACKUP_TS}.sql.gz"
          echo "BACKUP_KEY=${BACKUP_KEY}" >> "$GITHUB_ENV"
          echo "BACKUP_TS=${BACKUP_TS}" >> "$GITHUB_ENV"
          echo "Creating scheduled backup: ${BACKUP_KEY}"

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::SUPABASE_DATABASE_URL secret is empty"
            exit 1
          fi

          # `set -o pipefail` makes a pg_dump failure abort the gzip pipe.
          /usr/lib/postgresql/17/bin/pg_dump \
            "$DATABASE_URL" \
            --no-owner --no-acl --format=plain \
            --exclude-schema='auth' --exclude-schema='storage' \
            --exclude-schema='realtime' --exclude-schema='supabase_migrations' \
            | gzip > /tmp/backup.sql.gz

          BACKUP_SIZE=$(stat -c%s /tmp/backup.sql.gz)
          echo "BACKUP_SIZE=${BACKUP_SIZE}" >> "$GITHUB_ENV"
          if [ "$BACKUP_SIZE" -lt 1024 ]; then
            echo "::error::Backup too small (${BACKUP_SIZE} bytes), likely empty or failed"
            # Surface first 200 bytes of the gunzipped dump for debugging
            gunzip -c /tmp/backup.sql.gz | head -c 200 || true
            exit 1
          fi
          echo "Backup size: ${BACKUP_SIZE} bytes"
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload backup to S3
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_BUCKET:-}" ]; then
            echo "::error::S3_BACKUP_BUCKET is not set. Create a PRIVATE bucket (no CloudFront origin) and add it as a secret; refusing to write a database dump into a public bucket."
            exit 1
          fi
          aws s3 cp /tmp/backup.sql.gz "s3://${BACKUP_BUCKET}/${BACKUP_KEY}" \
            --storage-class STANDARD_IA \
            --metadata "timestamp=${BACKUP_TS},size=${BACKUP_SIZE},type=scheduled"
          echo "Backup uploaded to s3://${BACKUP_BUCKET}/${BACKUP_KEY}"

      - name: Verify backup in S3
        run: |
          S3_SIZE=$(aws s3api head-object \
            --bucket "$BACKUP_BUCKET" \
            --key "$BACKUP_KEY" \
            --query 'ContentLength' --output text)
          if [ "$S3_SIZE" -lt 100 ]; then
            echo "::error::S3 object too small (${S3_SIZE} bytes)"
            exit 1
          fi
          echo "Verified S3 object: ${S3_SIZE} bytes"

      - name: Prune old backups
        run: |
          CUTOFF=$(date -u -d "${RETENTION_DAYS} days ago" +%Y%m%d 2>/dev/null \
                   || date -u -v-${RETENTION_DAYS}d +%Y%m%d)
          echo "Pruning scheduled backups older than ${CUTOFF} (${RETENTION_DAYS} days)"
          aws s3api list-objects-v2 \
            --bucket "$BACKUP_BUCKET" \
            --prefix "backups/scheduled/" \
            --query "Contents[?LastModified<='${CUTOFF}'].Key" \
            --output text | tr '\t' '\n' | while read -r key; do
              if [ -n "$key" ] && [ "$key" != "None" ]; then
                echo "Deleting old backup: ${key}"
                aws s3 rm "s3://${BACKUP_BUCKET}/${key}"
              fi
            done

      - name: Cleanup
        if: always()
        run: rm -f /tmp/backup.sql.gz
