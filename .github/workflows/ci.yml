name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least-privilege default for GITHUB_TOKEN. Jobs that need more (package push,
# code-scanning upload, OIDC) grant the minimum extra at the job level.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  # IMAGE_NAME must be lowercase — Trivy/Cosign reject uppercase image refs
  IMAGE_NAME: aaraikai/complyeasyai
  AWS_REGION: us-east-1

jobs:
  # ============================================
  # LINT & TYPE CHECK
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./server

      - name: TypeScript — Server
        run: npx tsc --noEmit
        working-directory: ./server
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: TypeScript — Frontend
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

  # ============================================
  # DIAGNOSTIC: reproduce alpine docker build outside buildx
  # ============================================
  diagnose-alpine-build:
    name: Diagnose Alpine TSC Build
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run npm run build inside node:22-alpine
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/work" \
            -w /work/server \
            node:22-alpine sh -c '
              set +e
              apk add --no-cache libc6-compat openssl >/dev/null 2>&1
              echo "===== npm ci ====="
              npm ci 2>&1 | tail -60
              ec=$?
              echo "===== npm ci exit=$ec ====="
              [ $ec -ne 0 ] && exit $ec
              echo "===== prisma generate ====="
              npx prisma generate 2>&1 | tail -20
              echo "===== node scripts/patch-tfjs-types.js ====="
              node scripts/patch-tfjs-types.js 2>&1 | tail -10
              echo "===== npm run build ====="
              npm run build 2>&1
              ec=$?
              echo "===== npm run build exit=$ec ====="
              exit $ec
            ' 2>&1 | tee /tmp/alpine-build.log
          echo "===== final exit codes ====="
          tail -200 /tmp/alpine-build.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpine-build-diagnostic
          path: /tmp/alpine-build.log
          if-no-files-found: warn

  # ============================================
  # BACKEND UNIT TESTS
  # ============================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: ./server
      - run: npx prisma generate
        working-directory: ./server

      - name: Run unit tests
        run: npm run test:unit -- --coverage --ci --forceExit
        working-directory: ./server
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-for-testing-purposes-only-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-purposes-only-min-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-minimum-length-required!!!
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NODE_OPTIONS: --max-old-space-size=4096

      - uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          directory: ./server/coverage
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================
  # BACKEND INTEGRATION TESTS
  # ============================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: ./server
      - run: npx prisma generate
        working-directory: ./server
      - name: Reset test DB and create extensions
        run: |
          PGPASSWORD=test psql -h localhost -U test -d test_db -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          PGPASSWORD=test psql -h localhost -U test -d test_db -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Push schema to test DB
        run: npx prisma db push --accept-data-loss
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db

      - name: Run integration tests
        run: npm run test:integration -- --ci --forceExit
        working-directory: ./server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-purposes-only-min-32-chars
          JWT_EXPIRES_IN: 1h
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-purposes-only-min-32-chars
          JWT_REFRESH_EXPIRES_IN: 7d
          ENCRYPTION_KEY: test-encryption-key-32-chars-minimum-length-required!!!
          NODE_OPTIONS: --max-old-space-size=4096

  # ============================================
  # FRONTEND TESTS (Vitest)
  # ============================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - name: Run Vitest
        run: npm test -- --run
        env:
          NODE_ENV: test

  # ============================================
  # E2E TESTS (Playwright)
  # ============================================
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    # Hard cap so a stuck backend / hung playwright session can't burn the
    # default 6h GitHub Actions job timeout. The full ~1,100-test browser suite
    # exceeds this at 2 workers in a single job, so it is sharded across parallel
    # runners (each shard runs ~1/N of the tests against its own isolated stack).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: ./server

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - run: npx prisma generate
        working-directory: ./server
      - name: Reset test DB and create extensions
        run: |
          PGPASSWORD=test psql -h localhost -U test -d test_db -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          PGPASSWORD=test psql -h localhost -U test -d test_db -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
      - name: Push schema to test DB
        run: npx prisma db push --accept-data-loss
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db

      - name: Build frontend
        run: npm run build
        env:
          # Build the SPA to call the API same-origin (/api). `vite preview`
          # reverse-proxies /api to the backend on :3001, so the real httpOnly
          # session cookies flow with the app's XHRs — mirroring production
          # (CloudFront serves the SPA and proxies /api) and letting org-scoped
          # create flows persist in E2E instead of 401'ing under mock auth.
          VITE_API_URL: /api

      # Gate on valid structured data: parse every prerendered JSON-LD block and
      # assert minimal required fields per @type. Fails the job on any malformed
      # or empty schema so SEO/AEO structured data never regresses silently.
      - name: Validate JSON-LD structured data
        run: npm run validate:seo

      - name: Start frontend preview
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 15); do
            wget -qO- http://localhost:4173/ > /dev/null 2>&1 && break
            sleep 2
          done

      - name: Start backend
        working-directory: ./server
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          # Capture stdout/stderr so we can surface them if startup fails.
          node dist/index.js > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"

          ready=0
          for i in $(seq 1 30); do
            if wget -qO- http://localhost:3001/health > /dev/null 2>&1; then
              ready=1
              break
            fi
            # If the process died, bail immediately rather than waiting the
            # full 60 seconds.
            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "::error::Backend process exited before /health became reachable"
              echo "--- backend.log (tail) ---"
              tail -200 /tmp/backend.log || true
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::Backend did not become healthy within 60s"
            echo "--- backend.log (tail) ---"
            tail -200 /tmp/backend.log || true
            exit 1
          fi
          echo "Backend is healthy on :3001"
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-purposes-only-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-purposes-only-min-32-chars
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          GEMINI_API_KEY: test-key
          SENDGRID_API_KEY: SG.test-key
          SENDGRID_FROM_EMAIL: test@test.com
          CLIENT_URL: http://localhost:4173
          CORS_ORIGIN: http://localhost:4173
          # E2E ONLY: relax the per-IP GENERAL API rate limiter (apiLimiter,
          # default 100 req / 15 min). Now that the E2E app authenticates with a
          # real session (same-origin auth.setup), every page loads real org data,
          # so the single Playwright source IP issues hundreds of /api reads and
          # trips the abuse limiter — surfacing as false "Failed to load (429)"
          # failures rather than real defects. Production keeps the strict default
          # (this env var is set ONLY for the E2E backend). authLimiter stays
          # hardcoded at 5/15min, so the dedicated brute-force rate-limit test
          # still exercises the real limiter.
          RATE_LIMIT_MAX_REQUESTS: '100000'

      - name: Run Playwright tests
        # --workers=1: the same-origin REAL-session suite exercises authenticated
        # flows that issue far more real /api calls per page than the old mock-auth
        # suite, so two concurrent browser contexts overload this shard's single
        # backend (and the 4-vCPU runner's memory) — producing flaky timeouts and
        # browser crashes on pages that pass in isolation. One worker per shard
        # keeps each backend within capacity; the 4 shards still run in parallel.
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/4 --workers=1
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4173
          API_URL: http://localhost:3001

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # ============================================
  # SECURITY SCAN
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm ci
        working-directory: ./server
      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit server dependencies
        # The server tree carries a documented set of known-unfixable advisories
        # (elliptic, aws-sdk v2, serialize-javascript via circom/mocha, legacy
        # @azure/* → uuid) whose only fix is a breaking major upgrade of a
        # toolchain dependency — see .claude/CLAUDE.md "Known unfixable upstream
        # vulnerabilities". We still surface HIGH+ for visibility, but do not
        # hard-fail the pipeline solely on that known set. The `|| true` is
        # scoped to this single audit step (no blanket continue-on-error), so a
        # newly introduced HIGH still shows up in the logs for triage.
        run: npm audit --audit-level=high || true
        working-directory: ./server
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'

  # ============================================
  # SECRET SCANNING (GitLeaks)
  # ============================================
  secret-scan:
    name: Secret Scanning (GitLeaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # Full history for comprehensive secret scanning

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CodeQL SAST runs in its own workflow (.github/workflows/codeql.yml) to keep
  # a single source of truth; the previously-duplicated codeql job here was
  # removed. Branch protection should require the "CodeQL Advanced" check.

  # ============================================
  # BUILD & PUSH DOCKER IMAGES
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-backend, test-integration, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Regenerate the ZK proving keys + compiled circuits into the workspace so
      # the Docker build context contains them and the backend-production stage
      # can COPY them into dist/zkp/. The .zkey/.wasm are gitignored (regenerated
      # per environment), so without this step the deployed image has no ZK
      # artifacts and cannot generate/verify real Groth16 proofs.
      - name: Generate ZK proving keys
        run: |
          set -euo pipefail

          # (a) Install the pinned circom v2.1.6 linux-amd64 binary, verifying its
          # SHA-256 against the digest committed in checksums.sha256.
          CIRCOM_SHA256=f3958483caaaa0cdd3912df5049e2e635eab4d09b9a66807be9633d547859f12
          curl -L -o /tmp/circom \
            https://github.com/iden3/circom/releases/download/v2.1.6/circom-linux-amd64
          ACTUAL_SHA256="$(sha256sum /tmp/circom | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$CIRCOM_SHA256" ]; then
            echo "circom binary SHA-256 mismatch:"
            echo "  expected: $CIRCOM_SHA256"
            echo "  actual:   $ACTUAL_SHA256"
            exit 1
          fi
          chmod +x /tmp/circom
          sudo mv /tmp/circom /usr/local/bin/circom

          # (b) Install the JS deps the setup needs (circomlib for the .circom
          # includes, snarkjs for the Groth16 setup) without touching package.json.
          cd server
          npm install --no-save --legacy-peer-deps circomlib@2.0.5 snarkjs@0.7.6
          cd ..

          # (c) Compile circuits + run the (multi-contributor) trusted setup.
          cd server/src/zkp
          ZKEY_EXTRA_CONTRIBUTORS=2 bash setup-circuits.sh
          cd -

          # (d) Assert every required artifact was produced; fail closed otherwise.
          ZKP=server/src/zkp
          MISSING=0
          for f in \
            "$ZKP/compiled/wasm/compliance_check.wasm" \
            "$ZKP/compiled/wasm/credential_verification.wasm" \
            "$ZKP/compiled/wasm/data_ownership.wasm" \
            "$ZKP/keys/proving/compliance_check.zkey" \
            "$ZKP/keys/proving/credential_verification.zkey" \
            "$ZKP/keys/proving/data_ownership.zkey" \
            "$ZKP/keys/verification/compliance_check.vkey" \
            "$ZKP/keys/verification/credential_verification.vkey" \
            "$ZKP/keys/verification/data_ownership.vkey"; do
            if [ ! -f "$f" ]; then
              echo "Missing required ZK artifact: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "ZK artifact generation incomplete — refusing to build image."
            exit 1
          fi
          echo "All ZK artifacts present."

      # --- API image ---
      - name: API metadata
        id: meta-api
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long

      - name: Build & push API
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: backend-production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Web (Nginx) image ---
      - name: Web metadata
        id: meta-web
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long

      - name: Build & push Web
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: frontend-production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # CONTAINER IMAGE SCANNING
  # ============================================
  scan-images:
    name: Scan Container Images
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API image:
      # 1) SARIF for GitHub Security tab (no gate — logs all severities)
      # 2) Table-format gate that fails only on fixable CRITICAL vulns
      - name: Scan API image with Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          exit-code: '0'

      - name: Upload API scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always()
        with:
          sarif_file: 'trivy-api-results.sarif'
          category: 'container-api'

      - name: Scan API image with Trivy (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # Web image: same pattern
      - name: Scan Web image with Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-web-results.sarif'
          exit-code: '0'

      - name: Upload Web scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always()
        with:
          sarif_file: 'trivy-web-results.sarif'
          category: 'container-web'

      - name: Scan Web image with Trivy (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  # ============================================
  # CONTAINER IMAGE SIGNING (Cosign)
  # ============================================
  sign-images:
    name: Sign Container Images
    runs-on: ubuntu-latest
    needs: [scan-images]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write  # For keyless signing

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign API image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Sign Web image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1

  # ============================================
  # APPROVAL GATE — Production deployment requires manual approval
  # Configure required reviewers in GitHub: Settings > Environments > production
  # ============================================
  approve-production:
    name: Approve Production Deploy
    runs-on: ubuntu-latest
    needs: [sign-images, security]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-approval
    steps:
      - name: Deployment approved
        run: echo "Production deployment approved by reviewer"

  # ============================================
  # DEPLOY — Production (main branch)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [approve-production]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://complyeasyai.com

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5

      - name: Push API image to ECR
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          ECR_REPO: complyeasy-production-api
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }} $ECR/$ECR_REPO:${{ github.sha }}
          docker push $ECR/$ECR_REPO:${{ github.sha }}

      - name: Pre-migration database backup
        run: |
          BACKUP_TS=$(date -u +%Y%m%d_%H%M%S)
          BACKUP_KEY="backups/pre-migration/${BACKUP_TS}_${GITHUB_SHA:0:7}.sql.gz"
          echo "Creating pre-migration backup: ${BACKUP_KEY}"
          pg_dump "$DATABASE_URL" --no-owner --no-acl | gzip > "/tmp/backup.sql.gz"
          BACKUP_SIZE=$(stat -f%z "/tmp/backup.sql.gz" 2>/dev/null || stat -c%s "/tmp/backup.sql.gz")
          if [ "$BACKUP_SIZE" -lt 100 ]; then
            echo "::error::Pre-migration backup too small (${BACKUP_SIZE} bytes), aborting deployment"
            exit 1
          fi
          aws s3 cp /tmp/backup.sql.gz "s3://${{ secrets.S3_FRONTEND_BUCKET }}/${BACKUP_KEY}"
          rm -f /tmp/backup.sql.gz
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      - name: Run database migrations (Supabase)
        run: |
          cd server && npm ci --omit=dev && npx prisma generate && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      - name: Deploy API to ECS
        run: |
          aws ecs update-service \
            --cluster complyeasy-production \
            --service complyeasy-production-api \
            --force-new-deployment

      - name: Build frontend
        run: npm ci && npm run build

      - name: Deploy frontend to S3 + CloudFront
        run: |
          # 1) Upload hashed assets with a 1-year immutable cache. Every HTML
          #    file (root index.html AND nested prerendered per-route
          #    index.html) is excluded here so it never inherits immutable
          #    caching, then re-uploaded with no-cache below.
          aws s3 sync ./dist s3://${{ secrets.S3_FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" --exclude "*.json"
          # 2) Re-upload all HTML (root + nested prerendered shells) with a
          #    no-cache policy so deploys are picked up immediately. The
          #    recursive copy with --exclude "*" --include "*.html" covers
          #    every index.html at any depth (e.g. /learn/index.html).
          aws s3 cp ./dist s3://${{ secrets.S3_FRONTEND_BUCKET }} \
            --recursive \
            --exclude "*" --include "*.html" \
            --content-type "text/html" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Wait for ECS stability
        run: |
          aws ecs wait services-stable \
            --cluster complyeasy-production \
            --services complyeasy-production-api

      - name: Verify health
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://complyeasyai.com/health)
            [ "$STATUS" = "200" ] && echo "Healthy" && exit 0
            sleep 10
          done
          exit 1

  # ============================================
  # DEPLOY — Staging (develop branch)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker, security]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.complyeasyai.com

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5

      - name: Push to ECR + deploy
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          ECR_REPO: complyeasy-staging-api
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:develop
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:develop $ECR/$ECR_REPO:staging
          docker push $ECR/$ECR_REPO:staging

      - name: Run migrations (Supabase)
        run: cd server && npm ci --omit=dev && npx prisma generate && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}

      - name: Deploy to staging ECS
        run: |
          aws ecs update-service \
            --cluster complyeasy-staging \
            --service complyeasy-staging-api \
            --force-new-deployment

  # ============================================
  # NOTIFY
  # ============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always() && (needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success')
    steps:
      - name: Slack notification
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true # Notification failure should not block pipeline
