name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1

jobs:
  # ============================================
  # LINT & TYPE CHECK
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./server

      - name: TypeScript — Server
        run: npx tsc --noEmit
        working-directory: ./server
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: TypeScript — Frontend
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0

  # ============================================
  # BACKEND UNIT TESTS
  # ============================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: ./server
      - run: npx prisma generate
        working-directory: ./server

      - name: Run unit tests
        run: npm run test:unit -- --coverage --ci --forceExit
        working-directory: ./server
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-for-testing-purposes-only-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-purposes-only-min-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-minimum-length-required!!!
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NODE_OPTIONS: --max-old-space-size=4096

      - uses: codecov/codecov-action@v4
        with:
          directory: ./server/coverage
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================
  # BACKEND INTEGRATION TESTS
  # ============================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: ./server
      - run: npx prisma generate
        working-directory: ./server
      - run: npx prisma migrate deploy
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db

      - name: Run integration tests
        run: npm run test:integration -- --ci --forceExit
        working-directory: ./server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-purposes-only-min-32-chars
          JWT_EXPIRES_IN: 1h
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-purposes-only-min-32-chars
          JWT_REFRESH_EXPIRES_IN: 7d
          ENCRYPTION_KEY: test-encryption-key-32-chars-minimum-length-required!!!
          NODE_OPTIONS: --max-old-space-size=4096

  # ============================================
  # FRONTEND TESTS (Vitest)
  # ============================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - name: Run Vitest
        run: npm test -- --run
        env:
          NODE_ENV: test

  # ============================================
  # E2E TESTS (Playwright)
  # ============================================
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: ./server

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - run: npx prisma generate
        working-directory: ./server
      - run: npx prisma migrate deploy
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db

      - name: Build frontend
        run: npm run build

      - name: Start backend
        working-directory: ./server
        run: |
          npm run build
          node dist/index.js &
          for i in $(seq 1 30); do
            wget -qO- http://localhost:3001/health > /dev/null 2>&1 && break
            sleep 2
          done
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-purposes-only-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-purposes-only-min-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-minimum-length-required!!!
          GEMINI_API_KEY: test-key
          SENDGRID_API_KEY: SG.test-key
          SENDGRID_FROM_EMAIL: test@test.com
          CLIENT_URL: http://localhost:4173

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4173
          API_URL: http://localhost:3001

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ============================================
  # SECURITY SCAN
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm ci
        working-directory: ./server
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: ./server
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  # ============================================
  # SECRET SCANNING (GitLeaks)
  # ============================================
  secret-scan:
    name: Secret Scanning (GitLeaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for comprehensive secret scanning

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # CODEQL SAST ANALYSIS
  # ============================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ============================================
  # BUILD & PUSH DOCKER IMAGES
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-backend, test-integration, test-frontend, test-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- API image ---
      - name: API metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend-production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Web (Nginx) image ---
      - name: Web metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend-production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # CONTAINER IMAGE SCANNING
  # ============================================
  scan-images:
    name: Scan Container Images
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload API scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-api-results.sarif'
          category: 'container-api'

      - name: Scan Web image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-web-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Web scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-web-results.sarif'
          category: 'container-web'

  # ============================================
  # CONTAINER IMAGE SIGNING (Cosign)
  # ============================================
  sign-images:
    name: Sign Container Images
    runs-on: ubuntu-latest
    needs: [scan-images]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write  # For keyless signing

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign API image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Sign Web image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest
        env:
          COSIGN_EXPERIMENTAL: 1

  # ============================================
  # APPROVAL GATE — Production deployment requires manual approval
  # Configure required reviewers in GitHub: Settings > Environments > production
  # ============================================
  approve-production:
    name: Approve Production Deploy
    runs-on: ubuntu-latest
    needs: [sign-images, security]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-approval
    steps:
      - name: Deployment approved
        run: echo "Production deployment approved by reviewer"

  # ============================================
  # DEPLOY — Production (main branch)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [approve-production]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://complyeasyai.com

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push API image to ECR
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          ECR_REPO: complyeasy-production-api
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest $ECR/$ECR_REPO:latest
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest $ECR/$ECR_REPO:${{ github.sha }}
          docker push $ECR/$ECR_REPO:latest
          docker push $ECR/$ECR_REPO:${{ github.sha }}

      - name: Pre-migration database backup
        run: |
          BACKUP_TS=$(date -u +%Y%m%d_%H%M%S)
          BACKUP_KEY="backups/pre-migration/${BACKUP_TS}_${GITHUB_SHA:0:7}.sql.gz"
          echo "Creating pre-migration backup: ${BACKUP_KEY}"
          pg_dump "$DATABASE_URL" --no-owner --no-acl | gzip > "/tmp/backup.sql.gz"
          BACKUP_SIZE=$(stat -f%z "/tmp/backup.sql.gz" 2>/dev/null || stat -c%s "/tmp/backup.sql.gz")
          if [ "$BACKUP_SIZE" -lt 100 ]; then
            echo "::error::Pre-migration backup too small (${BACKUP_SIZE} bytes), aborting deployment"
            exit 1
          fi
          aws s3 cp /tmp/backup.sql.gz "s3://${{ secrets.S3_FRONTEND_BUCKET }}/${BACKUP_KEY}"
          rm -f /tmp/backup.sql.gz
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      - name: Run database migrations (Supabase)
        run: |
          cd server && npm ci --omit=dev && npx prisma generate && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      - name: Deploy API to ECS
        run: |
          aws ecs update-service \
            --cluster complyeasy-production \
            --service complyeasy-production-api \
            --force-new-deployment

      - name: Build frontend
        run: npm ci && npm run build

      - name: Deploy frontend to S3 + CloudFront
        run: |
          aws s3 sync ./dist s3://${{ secrets.S3_FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" --exclude "*.json"
          aws s3 cp ./dist/index.html s3://${{ secrets.S3_FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Wait for ECS stability
        run: |
          aws ecs wait services-stable \
            --cluster complyeasy-production \
            --services complyeasy-production-api

      - name: Verify health
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://complyeasyai.com/health)
            [ "$STATUS" = "200" ] && echo "Healthy" && exit 0
            sleep 10
          done
          exit 1

  # ============================================
  # DEPLOY — Staging (develop branch)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker, security]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.complyeasyai.com

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR + deploy
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          ECR_REPO: complyeasy-staging-api
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:develop
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:develop $ECR/$ECR_REPO:staging
          docker push $ECR/$ECR_REPO:staging

      - name: Run migrations (Supabase)
        run: cd server && npm ci --omit=dev && npx prisma generate && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}

      - name: Deploy to staging ECS
        run: |
          aws ecs update-service \
            --cluster complyeasy-staging \
            --service complyeasy-staging-api \
            --force-new-deployment

  # ============================================
  # NOTIFY
  # ============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always() && (needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success')
    steps:
      - name: Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
