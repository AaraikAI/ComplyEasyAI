name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # A run's secrets are snapshotted when the run is CREATED, so a run already
  # waiting at the approval gate can never see a secret rotated afterwards — and
  # re-running it reuses that same snapshot. Without a manual trigger the only
  # way to pick up a rotated credential was to invent a commit. This lets you
  # start a genuinely new run instead.
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN. Jobs that need more (package push,
# code-scanning upload, OIDC) grant the minimum extra at the job level.
permissions:
  contents: read

# Serialize runs per ref so two closely-spaced merges to main cannot deploy at
# the same time. Overlapping deploys were not merely wasteful: each one polled
# for ITS OWN task definition revision to become the only active one, so when a
# newer revision superseded an older deploy mid-flight, the older job waited out
# its full 15-minute budget and then failed with a message blaming a container
# boot crash. main QUEUES rather than cancels — cancelling a job mid-rollout
# would abandon an in-flight ECS deployment — while PR runs still cancel their
# own superseded runs to save CI time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  # IMAGE_NAME must be lowercase — Trivy/Cosign reject uppercase image refs
  IMAGE_NAME: aaraikai/complyeasyai
  AWS_REGION: us-east-1
  # Make every npm invocation in the pipeline survive a transient registry
  # blip. A bare `npm ci` retries very little by default, so a single
  # ECONNRESET mid-install failed an entire production deploy (run
  # 31536545427). These are read by npm from the environment, so they apply to
  # every job without touching each step.
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

jobs:
  # ============================================
  # LINT & TYPE CHECK
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./server

      - name: TypeScript — Server
        run: npx tsc --noEmit
        working-directory: ./server
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: TypeScript — Frontend
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

  # ============================================
  # DIAGNOSTIC: reproduce alpine docker build outside buildx
  # ============================================
  diagnose-alpine-build:
    name: Diagnose Alpine TSC Build
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run npm run build inside node:22-alpine
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/work" \
            -w /work/server \
            node:22-alpine sh -c '
              set +e
              apk add --no-cache libc6-compat openssl >/dev/null 2>&1
              echo "===== npm ci ====="
              npm ci 2>&1 | tail -60
              ec=$?
              echo "===== npm ci exit=$ec ====="
              [ $ec -ne 0 ] && exit $ec
              echo "===== prisma generate ====="
              npx prisma generate 2>&1 | tail -20
              echo "===== node scripts/patch-tfjs-types.js ====="
              node scripts/patch-tfjs-types.js 2>&1 | tail -10
              echo "===== npm run build ====="
              npm run build 2>&1
              ec=$?
              echo "===== npm run build exit=$ec ====="
              exit $ec
            ' 2>&1 | tee /tmp/alpine-build.log
          echo "===== final exit codes ====="
          tail -200 /tmp/alpine-build.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpine-build-diagnostic
          path: /tmp/alpine-build.log
          if-no-files-found: warn

  # ============================================
  # BACKEND UNIT TESTS
  # ============================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: ./server
      - run: npx prisma generate
        working-directory: ./server

      - name: Run unit tests
        run: npm run test:unit -- --coverage --ci --forceExit
        working-directory: ./server
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-for-testing-purposes-only-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-purposes-only-min-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-minimum-length-required!!!
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NODE_OPTIONS: --max-old-space-size=4096

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          directory: ./server/coverage
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================
  # BACKEND INTEGRATION TESTS
  # ============================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: ./server
      - run: npx prisma generate
        working-directory: ./server
      - name: Reset test DB and create extensions
        run: |
          PGPASSWORD=test psql -h localhost -U test -d test_db -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          PGPASSWORD=test psql -h localhost -U test -d test_db -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Push schema to test DB
        run: npx prisma db push --accept-data-loss
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db

      - name: Run integration tests
        run: npm run test:integration -- --ci --forceExit
        working-directory: ./server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-purposes-only-min-32-chars
          JWT_EXPIRES_IN: 1h
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-purposes-only-min-32-chars
          JWT_REFRESH_EXPIRES_IN: 7d
          ENCRYPTION_KEY: test-encryption-key-32-chars-minimum-length-required!!!
          NODE_OPTIONS: --max-old-space-size=4096

  # ============================================
  # FRONTEND TESTS (Vitest)
  # ============================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - name: Run Vitest
        run: npm test -- --run
        env:
          NODE_ENV: test

  # ============================================
  # E2E TESTS (Playwright)
  # ============================================
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    # Hard cap so a stuck backend / hung playwright session can't burn the
    # default 6h GitHub Actions job timeout. The full ~1,100-test browser suite
    # exceeds this at 2 workers in a single job, so it is sharded across parallel
    # runners (each shard runs ~1/N of the tests against its own isolated stack).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: ./server

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - run: npx prisma generate
        working-directory: ./server
      - name: Reset test DB and create extensions
        run: |
          PGPASSWORD=test psql -h localhost -U test -d test_db -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          PGPASSWORD=test psql -h localhost -U test -d test_db -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
      - name: Push schema to test DB
        run: npx prisma db push --accept-data-loss
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db

      - name: Build frontend
        run: npm run build
        env:
          # Build the SPA to call the API same-origin (/api). `vite preview`
          # reverse-proxies /api to the backend on :3001, so the real httpOnly
          # session cookies flow with the app's XHRs — mirroring production
          # (CloudFront serves the SPA and proxies /api) and letting org-scoped
          # create flows persist in E2E instead of 401'ing under mock auth.
          VITE_API_URL: /api

      # Gate on valid structured data: parse every prerendered JSON-LD block and
      # assert minimal required fields per @type. Fails the job on any malformed
      # or empty schema so SEO/AEO structured data never regresses silently.
      - name: Validate JSON-LD structured data
        run: npm run validate:seo

      - name: Start frontend preview
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 15); do
            wget -qO- http://localhost:4173/ > /dev/null 2>&1 && break
            sleep 2
          done

      - name: Start backend
        working-directory: ./server
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          # Capture stdout/stderr so we can surface them if startup fails.
          node dist/index.js > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"

          ready=0
          for i in $(seq 1 30); do
            if wget -qO- http://localhost:3001/health > /dev/null 2>&1; then
              ready=1
              break
            fi
            # If the process died, bail immediately rather than waiting the
            # full 60 seconds.
            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "::error::Backend process exited before /health became reachable"
              echo "--- backend.log (tail) ---"
              tail -200 /tmp/backend.log || true
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::Backend did not become healthy within 60s"
            echo "--- backend.log (tail) ---"
            tail -200 /tmp/backend.log || true
            exit 1
          fi
          echo "Backend is healthy on :3001"
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-purposes-only-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-purposes-only-min-32-chars
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          GEMINI_API_KEY: test-key
          SENDGRID_API_KEY: SG.test-key
          SENDGRID_FROM_EMAIL: test@test.com
          CLIENT_URL: http://localhost:4173
          CORS_ORIGIN: http://localhost:4173
          # E2E ONLY: relax the per-IP GENERAL API rate limiter (apiLimiter,
          # default 100 req / 15 min). Now that the E2E app authenticates with a
          # real session (same-origin auth.setup), every page loads real org data,
          # so the single Playwright source IP issues hundreds of /api reads and
          # trips the abuse limiter — surfacing as false "Failed to load (429)"
          # failures rather than real defects. Production keeps the strict default
          # (this env var is set ONLY for the E2E backend). authLimiter stays
          # hardcoded at 5/15min, so the dedicated brute-force rate-limit test
          # still exercises the real limiter.
          RATE_LIMIT_MAX_REQUESTS: '100000'

      - name: Run Playwright tests
        # --workers=1: the same-origin REAL-session suite exercises authenticated
        # flows that issue far more real /api calls per page than the old mock-auth
        # suite, so two concurrent browser contexts overload this shard's single
        # backend (and the 4-vCPU runner's memory) — producing flaky timeouts and
        # browser crashes on pages that pass in isolation. One worker per shard
        # keeps each backend within capacity; the 4 shards still run in parallel.
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/4 --workers=1
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4173
          API_URL: http://localhost:3001

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # ============================================
  # SECURITY SCAN
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm ci
        working-directory: ./server
      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit server dependencies
        # The server tree carries a documented set of known-unfixable advisories
        # (elliptic, aws-sdk v2, serialize-javascript via circom/mocha, legacy
        # @azure/* → uuid) whose only fix is a breaking major upgrade of a
        # toolchain dependency — see .claude/CLAUDE.md "Known unfixable upstream
        # vulnerabilities". We still surface HIGH+ for visibility, but do not
        # hard-fail the pipeline solely on that known set. The `|| true` is
        # scoped to this single audit step (no blanket continue-on-error), so a
        # newly introduced HIGH still shows up in the logs for triage.
        run: npm audit --audit-level=high || true
        working-directory: ./server
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'

  # ============================================
  # SECRET SCANNING (GitLeaks)
  # ============================================
  secret-scan:
    name: Secret Scanning (GitLeaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Full history for comprehensive secret scanning

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CodeQL SAST runs in its own workflow (.github/workflows/codeql.yml) to keep
  # a single source of truth; the previously-duplicated codeql job here was
  # removed. Branch protection should require the "CodeQL Advanced" check.

  # ============================================
  # BUILD & PUSH DOCKER IMAGES
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-backend, test-integration, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Regenerate the ZK proving keys + compiled circuits into the workspace so
      # the Docker build context contains them and the backend-production stage
      # can COPY them into dist/zkp/. The .zkey/.wasm are gitignored (regenerated
      # per environment), so without this step the deployed image has no ZK
      # artifacts and cannot generate/verify real Groth16 proofs.
      - name: Generate ZK proving keys
        run: |
          set -euo pipefail

          # (a) Install the pinned circom v2.1.6 linux-amd64 binary, verifying its
          # SHA-256 against the digest committed in checksums.sha256.
          CIRCOM_SHA256=f3958483caaaa0cdd3912df5049e2e635eab4d09b9a66807be9633d547859f12
          curl -L -o /tmp/circom \
            https://github.com/iden3/circom/releases/download/v2.1.6/circom-linux-amd64
          ACTUAL_SHA256="$(sha256sum /tmp/circom | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$CIRCOM_SHA256" ]; then
            echo "circom binary SHA-256 mismatch:"
            echo "  expected: $CIRCOM_SHA256"
            echo "  actual:   $ACTUAL_SHA256"
            exit 1
          fi
          chmod +x /tmp/circom
          sudo mv /tmp/circom /usr/local/bin/circom

          # (b) Install the JS deps the setup needs (circomlib for the .circom
          # includes, snarkjs for the Groth16 setup) without touching package.json.
          cd server
          npm install --no-save --legacy-peer-deps circomlib@2.0.5 snarkjs@0.7.6
          cd ..

          # (c) Compile circuits + run the (multi-contributor) trusted setup.
          cd server/src/zkp
          ZKEY_EXTRA_CONTRIBUTORS=2 bash setup-circuits.sh
          cd -

          # (d) Assert every required artifact was produced; fail closed otherwise.
          ZKP=server/src/zkp
          MISSING=0
          for f in \
            "$ZKP/compiled/wasm/compliance_check.wasm" \
            "$ZKP/compiled/wasm/credential_verification.wasm" \
            "$ZKP/compiled/wasm/data_ownership.wasm" \
            "$ZKP/keys/proving/compliance_check.zkey" \
            "$ZKP/keys/proving/credential_verification.zkey" \
            "$ZKP/keys/proving/data_ownership.zkey" \
            "$ZKP/keys/verification/compliance_check.vkey" \
            "$ZKP/keys/verification/credential_verification.vkey" \
            "$ZKP/keys/verification/data_ownership.vkey"; do
            if [ ! -f "$f" ]; then
              echo "Missing required ZK artifact: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "ZK artifact generation incomplete — refusing to build image."
            exit 1
          fi
          echo "All ZK artifacts present."

      # --- API image ---
      - name: API metadata
        id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long

      - name: Build & push API
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: backend-production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Web (Nginx) image ---
      - name: Web metadata
        id: meta-web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long

      - name: Build & push Web
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: frontend-production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # CONTAINER IMAGE SCANNING
  # ============================================
  scan-images:
    name: Scan Container Images
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API image:
      # 1) SARIF for GitHub Security tab (no gate — logs all severities)
      # 2) Table-format gate that fails only on fixable CRITICAL vulns
      - name: Scan API image with Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          exit-code: '0'

      - name: Upload API scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: 'trivy-api-results.sarif'
          category: 'container-api'

      - name: Scan API image with Trivy (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # Web image: same pattern
      - name: Scan Web image with Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-web-results.sarif'
          exit-code: '0'

      - name: Upload Web scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: 'trivy-web-results.sarif'
          category: 'container-web'

      - name: Scan Web image with Trivy (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  # ============================================
  # CONTAINER IMAGE SIGNING (Cosign)
  # ============================================
  sign-images:
    name: Sign Container Images
    runs-on: ubuntu-latest
    needs: [scan-images]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write  # For keyless signing

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign API image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Sign Web image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1

  # ============================================
  # APPROVAL GATE — Production deployment requires manual approval
  # Configure required reviewers in GitHub: Settings > Environments > production
  # ============================================
  approve-production:
    name: Approve Production Deploy
    runs-on: ubuntu-latest
    needs: [sign-images, security]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-approval
    steps:
      - name: Deployment approved
        run: echo "Production deployment approved by reviewer"

  # ============================================
  # Gate: only deploy when the AWS/Supabase deploy secrets are actually set.
  # Without them the deploy job cannot authenticate ("Could not load credentials
  # from any providers") and the whole pipeline goes RED on every commit.
  # SKIPPING (not failing) the deploy keeps main green until the go-live secrets
  # are provisioned — see the "Go Live to Production" runbook. Once
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / SUPABASE_DATABASE_URL exist, the
  # deploy runs automatically.
  # ============================================
  check-deploy-secrets:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        # Read secrets into env (never interpolate secret values into the script
        # body) and test only for presence — the value is never printed.
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SUPA_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          S3_BUCKET: ${{ secrets.S3_FRONTEND_BUCKET }}
          CF_DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
        run: |
          # A run's secrets are snapshotted when the run is CREATED, so a secret
          # added while a run sits at the approval gate is invisible to it. This
          # job runs before the gate, so a missing secret shows up here — several
          # minutes in — rather than after an approval and an image push.
          if [ -n "$AWS_KEY" ] && [ -n "$AWS_SECRET" ] && [ -n "$SUPA_URL" ] \
             && [ -n "$S3_BUCKET" ] && [ -n "$CF_DIST" ] && [ -n "$BACKUP_BUCKET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets present — Deploy to Production will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            for pair in "AWS_ACCESS_KEY_ID:$AWS_KEY" "AWS_SECRET_ACCESS_KEY:$AWS_SECRET" \
                        "SUPABASE_DATABASE_URL:$SUPA_URL" "S3_FRONTEND_BUCKET:$S3_BUCKET" \
                        "CLOUDFRONT_DISTRIBUTION_ID:$CF_DIST" "S3_BACKUP_BUCKET:$BACKUP_BUCKET"; do
              name="${pair%%:*}"; value="${pair#*:}"
              [ -z "$value" ] && echo "  MISSING: $name"
            done
            echo "::notice title=Production deploy skipped::One or more deploy secrets are not visible to this run (see the job log for which). If you just added one, push a new commit — a run cannot see secrets created after it started."
          fi

  # ============================================
  # DEPLOY — Production (main branch)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [approve-production, check-deploy-secrets]
    if: github.ref == 'refs/heads/main' && needs.check-deploy-secrets.outputs.configured == 'true'
    environment:
      name: production
      url: https://complyeasyai.com

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Push API image to ECR
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          ECR_REPO: complyeasy-production-api
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }} $ECR/$ECR_REPO:${{ github.sha }}
          docker push $ECR/$ECR_REPO:${{ github.sha }}

      # The dump goes to a PRIVATE bucket, never S3_FRONTEND_BUCKET. That bucket is
      # the CloudFront origin for the public site, so anything written under it is
      # served to the internet — a database dump placed there is downloadable by
      # anyone who guesses the key (verified against the live distribution).
      # Fail closed rather than fall back to the frontend bucket.
      # Supabase runs Postgres 17.x and ubuntu-latest ships pg_dump 16, which
      # refuses to dump a newer server ("aborting because of server version
      # mismatch"). Install the matching major, exactly as scheduled-backup.yml
      # already does.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Pre-migration database backup
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_BUCKET:-}" ]; then
            echo "::error::S3_BACKUP_BUCKET is not set. Create a PRIVATE bucket (no CloudFront origin) and add it as a secret; refusing to write a database dump into the public frontend bucket."
            exit 1
          fi
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::SUPABASE_DATABASE_URL secret is empty"
            exit 1
          fi
          BACKUP_TS=$(date -u +%Y%m%d_%H%M%S)
          BACKUP_KEY="backups/pre-migration/${BACKUP_TS}_${GITHUB_SHA:0:7}.sql.gz"
          echo "Creating pre-migration backup: ${BACKUP_KEY}"
          # Call the pinned binary by path — the PATH default is still 16. The
          # Supabase-managed schemas are excluded because the application role
          # cannot read them, and pipefail makes a pg_dump failure abort the pipe
          # instead of leaving a valid-but-tiny gzip behind.
          /usr/lib/postgresql/17/bin/pg_dump \
            "$DATABASE_URL" \
            --no-owner --no-acl --format=plain \
            --exclude-schema='auth' --exclude-schema='storage' \
            --exclude-schema='realtime' --exclude-schema='supabase_migrations' \
            | gzip > /tmp/backup.sql.gz
          BACKUP_SIZE=$(stat -c%s /tmp/backup.sql.gz)
          if [ "$BACKUP_SIZE" -lt 1024 ]; then
            echo "::error::Pre-migration backup too small (${BACKUP_SIZE} bytes), aborting deployment"
            exit 1
          fi
          echo "Backup is ${BACKUP_SIZE} bytes"
          aws s3 cp /tmp/backup.sql.gz "s3://${BACKUP_BUCKET}/${BACKUP_KEY}"
          rm -f /tmp/backup.sql.gz

      # `prisma migrate deploy` needs the CLI, the schema, DATABASE_URL — and a
      # server/node_modules, because prisma.config.ts imports `prisma/config`
      # and `dotenv`. Node resolves both of those from server/, NOT from the
      # temporary directory that `npx --yes prisma@X` installs into, so without
      # them present here the CLI cannot load its own config file and every
      # attempt dies with "Cannot find module 'dotenv/config'" (run
      # 31634406344, which blocked the deploy of dcdd40b6 entirely).
      #
      # Installing only those two packages, at the versions the lockfile pins,
      # costs ~90 packages and a few seconds — versus the 600+ (aws-sdk,
      # tensorflow, sharp) that `npm ci --omit=dev` pulled in to reach the same
      # place. `--prefix` is load-bearing: it stops npm reifying the whole
      # project tree from server/package.json. The install is then linked in as
      # server/node_modules so module resolution finds it.
      #
      # Running that binary directly instead of through npx also takes a
      # registry round-trip off the critical path of every production deploy.
      #
      # NOTE for anyone tempted to slim this further: `prisma` looks like a pure
      # devDependency in server/package.json, but @prisma/client (a production
      # dependency) declares it as `peerDependency: "*"`, so npm auto-installs
      # it and the lockfile marks node_modules/prisma as dev:false. That is why
      # the older `npm ci --omit=dev` step worked, and why `npx prisma` ran the
      # lockfile-pinned CLI rather than a floating latest.
      #
      # Retried because this sits on the critical path of every production
      # deploy and a single transient ECONNRESET used to fail the whole thing.
      - name: Run database migrations (Supabase)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          cd server

          PRISMA_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/prisma'].version")
          DOTENV_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/dotenv'].version")
          echo "Using prisma@$PRISMA_VERSION with dotenv@$DOTENV_VERSION (pinned from package-lock.json)"

          CLI_DIR="$RUNNER_TEMP/prisma-cli"
          npm install --prefix "$CLI_DIR" --no-audit --no-fund --ignore-scripts \
            "prisma@$PRISMA_VERSION" "dotenv@$DOTENV_VERSION"

          # server/node_modules is gitignored and absent on a fresh checkout;
          # replacing it keeps this step idempotent when a job is re-run.
          rm -rf node_modules
          ln -s "$CLI_DIR/node_modules" node_modules

          # Fail here, with an actionable message, rather than inside Prisma's
          # config loader — whose "Cannot find module" says nothing about what
          # to do next.
          node -e "require.resolve('prisma/config'); require.resolve('dotenv/config')" || {
            echo "::error::prisma.config.ts imports are not resolvable from server/. The migration CLI cannot load its config without them."
            exit 1
          }

          for attempt in 1 2 3; do
            if "$CLI_DIR/node_modules/.bin/prisma" migrate deploy; then
              echo "Migrations applied on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::migrate deploy failed (attempt $attempt/3); retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done

          echo "::error::prisma migrate deploy failed after 3 attempts. If the cause was a network error the registry or Supabase was unreachable; anything else is a genuine migration failure and the database was NOT changed by the failed attempt."
          exit 1

      # Role ARNs for Express Mode are account-scoped; resolve the account from
      # the deploy credentials rather than carrying it as another secret.
      - name: Resolve AWS account ID
        id: acct
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      # Derive the next task definition from the one the service is running and
      # change ONLY the image. Everything else — the Secrets Manager references
      # for DATABASE_URL/JWT_SECRET/ENCRYPTION_KEY/REDIS_URL/etc., the env vars,
      # cpu/memory, and the awslogs group — is carried over untouched.
      #
      # This matters because the Express Mode action builds primaryContainer
      # purely from its own inputs and never reads the running service's
      # container config, so deploying with `image:` alone would register a task
      # definition with NO secrets and NO environment, and silently fall back to
      # the Express defaults of 256 CPU / 512 MiB. The container would then die
      # at boot on a missing DATABASE_URL. Deriving the revision here also means
      # a secret added in the console survives the next deploy automatically,
      # and no account ID or secret ARN has to be committed to this public repo.
      - name: Register task definition revision with the new image
        id: taskdef
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition complyeasy-production-complyeasy-production-api \
            --query 'taskDefinition' --output json > /tmp/td-current.json

          # Strip the server-managed fields RegisterTaskDefinition rejects, and
          # drop taskRoleArn when it is empty (an empty ARN is not valid input).
          jq --arg img "$ECR/complyeasy-production-api:$IMAGE_TAG" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            | if (.taskRoleArn // "") == "" then del(.taskRoleArn) else . end
          ' /tmp/td-current.json > /tmp/td-next.json

          ARN=$(aws ecs register-task-definition \
                  --cli-input-json file:///tmp/td-next.json \
                  --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "Registered $ARN"

          # Fail loudly here rather than after a half-applied deploy.
          for k in DATABASE_URL JWT_SECRET ENCRYPTION_KEY REDIS_URL; do
            jq -e --arg k "$k" \
              '.containerDefinitions[0].secrets | map(.name) | index($k)' \
              /tmp/td-next.json > /dev/null \
              || { echo "::error::$k missing from the new task definition"; exit 1; }
          done

      # Deployed with the AWS CLI rather than aws-actions/amazon-ecs-deploy-express-service.
      # That action's latest RELEASE (v1.2.2 = 7c48a2de) has no task-definition-arn
      # input — it exists only on unreleased main — and its other inputs rebuild
      # primaryContainer from scratch, which silently drops every secret and env
      # var and falls back to 256 CPU / 512 MiB. UpdateExpressGatewayService takes
      # the task definition directly and is in the released CLI, so the revision
      # derived above is deployed exactly as registered.
      - name: Deploy API to ECS Express Mode
        env:
          TD_ARN: ${{ steps.taskdef.outputs.arn }}
          SVC_ARN: arn:aws:ecs:${{ env.AWS_REGION }}:${{ steps.acct.outputs.id }}:service/complyeasy-production/complyeasy-production-api
        run: |
          set -euo pipefail

          if ! aws ecs update-express-gateway-service help >/dev/null 2>&1; then
            echo "::error::This runner's AWS CLI ($(aws --version 2>&1)) has no ecs update-express-gateway-service. Express Mode needs a newer CLI."
            exit 1
          fi

          echo "Deploying $TD_ARN to $SVC_ARN"
          aws ecs update-express-gateway-service \
            --service-arn "$SVC_ARN" \
            --task-definition-arn "$TD_ARN" >/dev/null

          # Wait for convergence ourselves, since the CLI returns immediately.
          # While a rollout is in flight the service lists BOTH the old and the
          # new revision in activeConfigurations; it is done when the new ARN is
          # the only one left and the service is ACTIVE.
          for i in $(seq 1 60); do
            OUT=$(aws ecs describe-express-gateway-service --service-arn "$SVC_ARN" --output json)
            CODE=$(printf '%s' "$OUT" | jq -r '.service.status.statusCode // "UNKNOWN"')
            ARNS=$(printf '%s' "$OUT" | jq -r '[.service.activeConfigurations[]?.taskDefinitionArn] | unique | join(",")')
            echo "  [$i/60] status=$CODE active=${ARNS:-<none>}"
            if [ "$CODE" = "ACTIVE" ] && [ "$ARNS" = "$TD_ARN" ]; then
              echo "Service converged on the new task definition."
              exit 0
            fi

            # A newer deploy can legitimately supersede this one. The
            # concurrency group above makes that rare, but a re-run or a
            # workflow_dispatch can still overlap. If OUR revision has been
            # dropped from activeConfigurations and a HIGHER revision is
            # serving, the service moved on deliberately and the rollout
            # succeeded — just not on our revision. Previously this waited out
            # the full 15 minutes and then failed with a message blaming a
            # container boot crash, which sent debugging in entirely the wrong
            # direction (run 31529113468).
            if [ "$CODE" = "ACTIVE" ] && [ -n "$ARNS" ] \
               && ! printf '%s' "$ARNS" | tr ',' '\n' | grep -qxF "$TD_ARN"; then
              MY_REV=${TD_ARN##*:}
              NEWEST=$(printf '%s' "$ARNS" | tr ',' '\n' | sed 's/.*://' | sort -n | tail -1)
              if [ -n "$NEWEST" ] && [ "$NEWEST" -gt "$MY_REV" ] 2>/dev/null; then
                echo "::notice::Superseded by task definition revision $NEWEST (this deploy registered revision $MY_REV). A newer deploy won the race; the service is ACTIVE and healthy, so this is not a failure."
                exit 0
              fi
            fi

            if [ "$CODE" = "INACTIVE" ]; then
              echo "::error::Service went INACTIVE during deployment"
              printf '%s' "$OUT" | jq -r '.service.status.statusReason // "no reason given"'
              exit 1
            fi
            sleep 15
          done
          echo "::error::Service did not converge on $TD_ARN within 15 minutes, and no higher revision superseded it (that case exits 0 above). This is a genuine rollout failure: check the stopped task's stoppedReason and its CloudWatch log stream — a container that dies during module import reports only 'Essential container in task exited'."
          exit 1

      # The SPA is served from the same origin as the API (CloudFront routes
      # /api/* to the Express service), so the bundle calls a relative /api.
      # This keeps the backend's httpOnly, sameSite='strict' session cookies
      # working — a cross-origin API URL would silently break login in prod.
      - name: Build frontend
        run: npm ci && npm run build
        env:
          VITE_API_URL: /api

      - name: Deploy frontend to S3 + CloudFront
        run: |
          # 1) Upload hashed assets with a 1-year immutable cache. Every HTML
          #    file (root index.html AND nested prerendered per-route
          #    index.html) is excluded here so it never inherits immutable
          #    caching, then re-uploaded with no-cache below.
          # --exclude "backups/*" is belt-and-braces: backups now go to a separate
          # private bucket, but --delete would otherwise erase anything historic
          # left under that prefix here.
          aws s3 sync ./dist s3://${{ secrets.S3_FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" --exclude "*.json" --exclude "backups/*"
          # 2) Re-upload all HTML (root + nested prerendered shells) with a
          #    no-cache policy so deploys are picked up immediately. The
          #    recursive copy with --exclude "*" --include "*.html" covers
          #    every index.html at any depth (e.g. /learn/index.html).
          aws s3 cp ./dist s3://${{ secrets.S3_FRONTEND_BUCKET }} \
            --recursive \
            --exclude "*" --include "*.html" \
            --content-type "text/html" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # (No explicit wait step: the Express Mode deploy action above already
      # blocks until the service and its deployment reach a stable state.)

      - name: Verify health
        run: |
          # 5 minutes, not 100 seconds: the ECS rollout is already converged by
          # this point, but the first request through CloudFront to a freshly
          # started task can still lose a round or two.
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://www.complyeasyai.com/health || echo 000)
            echo "  [$i/20] /health -> $STATUS"
            [ "$STATUS" = "200" ] && echo "Healthy" && exit 0
            sleep 15
          done
          echo "::error::/health never returned 200. A 503 here means the container is up but its database check is failing — check DB_CA_CERT and that DATABASE_URL uses the IPv4 pooler host."
          exit 1

  # ============================================
  # DEPLOY — Staging (develop branch)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker, security]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.complyeasyai.com

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Push to ECR + deploy
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          ECR_REPO: complyeasy-staging-api
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:develop
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:develop $ECR/$ECR_REPO:staging
          docker push $ECR/$ECR_REPO:staging

      - name: Run migrations (Supabase)
        run: cd server && npm ci --omit=dev && npx prisma generate && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}

      - name: Deploy to staging ECS
        run: |
          aws ecs update-service \
            --cluster complyeasy-staging \
            --service complyeasy-staging-api \
            --force-new-deployment

  # ============================================
  # NOTIFY
  # ============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always() && (needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success')
    steps:
      - name: Slack notification
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true # Notification failure should not block pipeline
