# Framework / regulation amendment monitor.
#
# Weekly: fetch every source in scripts/self-improvement/sources.json, detect
# content changes (deterministic hash diff), save the refreshed baseline state to the
# unprotected `framework-monitor-state` branch,
# and — when something changed — open a review issue AND hand the change report to
# the compliance agent so it can draft proposal PRs.
name: Framework Monitor

on:
  schedule:
    - cron: '23 7 * * 1' # Mondays 07:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: write # to dispatch the compliance-agent workflow

concurrency:
  group: framework-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Detect framework/regulation changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 20

      # Baselines live on the unprotected `framework-monitor-state` branch. The
      # default branch's ruleset blocks direct pushes from GITHUB_TOKEN, so a
      # baseline committed here never landed: from 2026-08-10 to 2026-09-07 every
      # weekly run re-detected the same three page changes and opened another
      # issue. Restore the last saved baseline before diffing.
      - name: Restore baseline state from the state branch
        run: |
          if git fetch --depth=1 origin framework-monitor-state 2>/dev/null; then
            git checkout FETCH_HEAD -- scripts/self-improvement/state
            git reset -q -- scripts/self-improvement/state
            echo "Restored baseline state from framework-monitor-state."
          else
            echo "No framework-monitor-state branch yet; using the checked-in baseline."
          fi

      - name: Run monitor
        id: monitor
        run: |
          node scripts/self-improvement/monitor-sources.mjs \
            --out "$RUNNER_TEMP/si" --update-state | tee -a "$GITHUB_OUTPUT"

      - name: Save refreshed baseline state to the state branch
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- scripts/self-improvement/state)" ]; then
            echo "Baseline unchanged."
            exit 0
          fi
          git config user.name "complyeasy-self-heal[bot]"
          git config user.email "self-heal@users.noreply.github.com"
          # Snapshot only the state directory onto an orphan commit and replace the
          # state branch with it; history is not needed and the branch is unprotected.
          TMP="$(mktemp -d)"
          cp -R scripts/self-improvement/state "$TMP/state"
          git checkout -q --orphan framework-monitor-state-tmp
          git rm -rfq . >/dev/null 2>&1 || true
          mkdir -p scripts/self-improvement
          cp -R "$TMP/state" scripts/self-improvement/state
          git add scripts/self-improvement/state
          git commit -qm "chore(monitor): baseline state $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push --force origin HEAD:framework-monitor-state
          echo "Saved baseline state to framework-monitor-state."

      - name: Open review issue for detected changes
        if: steps.monitor.outputs.changed_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for L in "compliance:5319e7" "needs-review:fbca04"; do
            gh label create "${L%%:*}" --color "${L##*:}" 2>/dev/null || true
          done
          # De-dupe: append to the open review issue instead of stacking a new one
          # every week (the same pattern self-heal-cve.yml uses).
          EXISTING="$(gh issue list --state open --label compliance --label needs-review \
            --search 'in:title "Framework/regulation change(s) detected"' \
            --json number --jq '.[0].number' || true)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/si/monitor-report.md"
            gh issue edit "$EXISTING" \
              --title "Framework/regulation change(s) detected (latest: $(date -u +%Y-%m-%d))"
            echo "Appended report to existing issue #$EXISTING."
          else
            gh issue create \
              --title "Framework/regulation change(s) detected ($(date -u +%Y-%m-%d))" \
              --body-file "$RUNNER_TEMP/si/monitor-report.md" \
              --label "compliance" --label "needs-review"
          fi

      - name: Upload report artifact
        if: steps.monitor.outputs.changed_count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: framework-monitor-report
          path: ${{ runner.temp }}/si/monitor-report.json
          retention-days: 30

      - name: Hand off to the compliance agent (draft proposal PRs)
        if: steps.monitor.outputs.changed_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Best-effort: only fires if the agent workflow exists and a key is set;
          # the agent workflow itself no-ops when ANTHROPIC_API_KEY is absent.
          gh workflow run compliance-agent.yml \
            -f reason="framework-monitor detected changes" || \
            echo "::notice::compliance-agent workflow not dispatched (optional)."
