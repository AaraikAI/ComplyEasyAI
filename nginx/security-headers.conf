# ---------------------------------------------------------------
# Security headers — single source of truth.
# nginx add_header directives do NOT inherit into a child scope that
# declares its own add_header, so this snippet is included into every
# location block that sets headers (and the server scope) to keep the
# full set applied on every response without drift.
# ---------------------------------------------------------------
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS — Strict Transport Security (1 year, include subdomains, preload-ready)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy — restrict resource loading to trusted origins
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
