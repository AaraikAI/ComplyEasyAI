# Upstream backend API server
upstream api_backend {
    server api:3001;
    keepalive 32;
}

# ---------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Allow health checks over HTTP (for ALB/internal probes)
    location /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------
# HTTPS server
# ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------
    # TLS Configuration
    # Certificates are mounted from the host via docker-compose volume
    # In production, use Let's Encrypt or ACM-provisioned certs
    # ---------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern TLS settings (TLS 1.2+ only)
    ssl_protocols TLSv1.2 TLSv1.3;
    # FIPS 140-2 compliant cipher suites only (CHACHA20-POLY1305 removed — not FIPS-approved)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session caching
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    # Docker's embedded DNS resolver — used for OCSP stapling upstream lookups
    resolver 127.0.0.11 valid=300s;
    resolver_timeout 5s;

    # ---------------------------------------------------------------
    # Security Headers (applied at server scope for every response).
    # Re-included in any location that declares its own add_header,
    # because add_header does not inherit into such child scopes.
    # ---------------------------------------------------------------
    include /etc/nginx/snippets/security-headers.conf;

    # ---------------------------------------------------------------
    # API Proxy — forward /api/* and /health to backend
    # ---------------------------------------------------------------
    location /api/ {
        # Per-IP rate limit with a small burst, no delay on the burst window
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket support for /socket.io
    location /socket.io/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ---------------------------------------------------------------
    # Static assets — long cache with immutable
    # ---------------------------------------------------------------
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # SPA fallback — serve index.html for all client-side routes
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Cache HTML briefly to pick up new deploys
        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
    }

    # ---------------------------------------------------------------
    # Deny access to hidden files
    # ---------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
