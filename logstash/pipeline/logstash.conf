input {
  http {
    port => 5044
    codec => json
  }
}

filter {
  if [level] {
    mutate {
      lowercase => [ "level" ]
    }
  }

  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }

  # Parse request information
  if [method] {
    mutate {
      add_field => { "http.method" => "%{method}" }
    }
  }

  if [path] {
    mutate {
      add_field => { "http.path" => "%{path}" }
    }
  }

  if [statusCode] {
    mutate {
      add_field => { "http.status_code" => "%{statusCode}" }
    }
  }

  # Add geo information if IP is available
  if [ip] {
    geoip {
      source => "ip"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTICSEARCH_PASSWORD:?Set ELASTICSEARCH_PASSWORD in .env}"
    index => "complyeasy-logs-%{+YYYY.MM.dd}"
  }

  # Also output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}

