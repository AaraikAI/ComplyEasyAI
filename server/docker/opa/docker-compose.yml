services:
  opa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: complyeasy-opa
    # Bound to loopback: consumers reach OPA over the internal network; the
    # host publish is for local debugging only.
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./policies:/policies
      - opa-data:/data
    environment:
      - OPA_LOG_LEVEL=info
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    # The OPA image is distroless (no curl/wget/shell), so an in-container HTTP
    # healthcheck cannot run; readiness against GET /health is validated from the
    # host. No service gates on opa being `service_healthy`.
    networks:
      - complyeasy-network

  opa-replica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: complyeasy-opa-replica
    # Bound to loopback: consumers reach OPA over the internal network; the
    # host publish is for local debugging only.
    ports:
      - "127.0.0.1:8182:8181"
    volumes:
      - ./policies:/policies
      - opa-data:/data
    environment:
      - OPA_LOG_LEVEL=info
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    # See the opa service above: distroless image, no in-container HTTP tooling.
    networks:
      - complyeasy-network
    depends_on:
      - opa

volumes:
  opa-data:

networks:
  complyeasy-network:
    driver: bridge

