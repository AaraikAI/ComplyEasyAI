# ============================================
# ComplyEasy AI - Docker Compose
# Development Environment
# ============================================

version: '3.9'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: complyeasy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-complyeasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
      POSTGRES_DB: ${POSTGRES_DB:-complyeasy_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-complyeasy} -d ${POSTGRES_DB:-complyeasy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - complyeasy-network

  # ============================================
  # Redis (Cache & Sessions)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: complyeasy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-localredis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localredis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - complyeasy-network

  # ============================================
  # Backend API Server
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: complyeasy-api
    restart: unless-stopped
    working_dir: /app/server
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-complyeasy}:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/${POSTGRES_DB:-complyeasy_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-localredis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-32-char-encryption-key!!!!!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@localhost}
      CLIENT_URL: http://localhost:3000
      API_URL: http://localhost:5000
    volumes:
      - ./server/src:/app/server/src:ro
      - ./server/prisma:/app/server/prisma:ro
      - /app/server/node_modules
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - complyeasy-network

  # ============================================
  # Frontend (Vite Dev Server)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: complyeasy-frontend
    restart: unless-stopped
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./App.tsx:/app/App.tsx:ro
      - ./index.tsx:/app/index.tsx:ro
      - ./index.html:/app/index.html:ro
      - ./types.ts:/app/types.ts:ro
      - ./constants.ts:/app/constants.ts:ro
      - ./components:/app/components:ro
      - ./services:/app/services:ro
      - ./contexts:/app/contexts:ro
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - complyeasy-network

  # ============================================
  # Database Admin (pgAdmin)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: complyeasy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@complyeasy.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - complyeasy-network
    profiles:
      - tools

  # ============================================
  # Prisma Studio
  # ============================================
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: complyeasy-prisma-studio
    working_dir: /app/server
    command: npx prisma studio
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-complyeasy}:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/${POSTGRES_DB:-complyeasy_db}?schema=public
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - complyeasy-network
    profiles:
      - tools

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  complyeasy-network:
    driver: bridge
