<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Baseline Content-Security-Policy for the statically-served SPA. Framing
      protection (frame-ancestors / X-Frame-Options) is enforced as an HTTP
      response header by the CloudFront ResponseHeadersPolicy
      (infrastructure/lib/frontend-stack.ts) and by nginx (nginx/security-headers.conf);
      it is intentionally omitted here because browsers ignore frame-ancestors
      (and report-uri/sandbox) when CSP is delivered via a <meta> tag. The API
      origin is build-time configured (VITE_API_URL) and may differ per
      environment, so connect-src permits same-origin plus https: while still
      blocking plugins and base-tag hijacking.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" />

    <!-- Static SEO fallbacks (React 19 hoists per-page metadata at runtime to override these) -->
    <title>ComplyEasy AI — AI Compliance Automation Platform for SOC 2, ISO 27001, GDPR & EU AI Act</title>
    <meta name="description" content="ComplyEasy AI automates compliance with AI-driven evidence collection, continuous monitoring, risk and vendor management, and audit readiness across SOC 2, ISO 27001, GDPR, HIPAA, the EU AI Act, and more." />
    <link rel="canonical" href="https://complyeasyai.com/" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Default Open Graph / Twitter card -->
    <meta property="og:title" content="ComplyEasy AI — AI Compliance Automation Platform for SOC 2, ISO 27001, GDPR & EU AI Act" />
    <meta property="og:description" content="AI-driven compliance automation for SOC 2, ISO 27001, GDPR, HIPAA, and the EU AI Act — evidence collection, continuous monitoring, and audit readiness." />
    <meta property="og:image" content="https://complyeasyai.com/og/default-og.svg" />
    <meta property="og:url" content="https://complyeasyai.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ComplyEasy AI" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ComplyEasy AI — AI Compliance Automation Platform" />
    <meta name="twitter:description" content="AI-driven compliance automation for SOC 2, ISO 27001, GDPR, HIPAA, and the EU AI Act." />
    <meta name="twitter:image" content="https://complyeasyai.com/og/default-og.svg" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.3);
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.5);
      }
      /* Gradient text utility */
      .text-gradient {
        background: linear-gradient(135deg, #0d9488 0%, #06b6d4 50%, #22d3ee 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .text-gradient-accent {
        background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      /* Glass morphism */
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .glass-dark {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      /* Mesh gradient background */
      .mesh-gradient {
        background:
          radial-gradient(at 40% 20%, rgba(13, 148, 136, 0.15) 0px, transparent 50%),
          radial-gradient(at 80% 0%, rgba(6, 182, 212, 0.1) 0px, transparent 50%),
          radial-gradient(at 0% 50%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
          radial-gradient(at 80% 50%, rgba(13, 148, 136, 0.08) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      }
      /* Noise texture overlay */
      .noise::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 1;
      }
      /* Dot pattern */
      .dot-pattern {
        background-image: radial-gradient(circle, rgba(13, 148, 136, 0.1) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      /* Ring chart */
      .ring-chart {
        transform: rotate(-90deg);
      }
      .ring-chart-label {
        transform: rotate(90deg);
      }
      /* Dark mode mesh gradient */
      .dark .mesh-gradient {
        background:
          radial-gradient(at 40% 20%, rgba(13, 148, 136, 0.25) 0px, transparent 50%),
          radial-gradient(at 80% 0%, rgba(6, 182, 212, 0.2) 0px, transparent 50%),
          radial-gradient(at 0% 50%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
          radial-gradient(at 80% 50%, rgba(13, 148, 136, 0.15) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(6, 182, 212, 0.2) 0px, transparent 50%);
      }
      /* Dark mode dot pattern */
      .dark .dot-pattern {
        background-image: radial-gradient(circle, rgba(13, 148, 136, 0.2) 1px, transparent 1px);
      }
      /* Dark mode scrollbar */
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.4);
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.6);
      }
      /* Warm neutral CSS custom properties for Home OS */
      :root {
        --warm-bg: #f5f4f0;
        --warm-bg2: #eeece6;
      }
      .dark {
        --warm-bg: #1c1b19;
        --warm-bg2: #242320;
      }
      /* Safe area padding for mobile bottom bar */
      .safe-area-pb {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      /* Transition for theme changes */
      html {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* ======================================
         DARK MODE TEXT COLOR OVERRIDES
         Ensures readability when dark mode is enabled
         ====================================== */
      .dark .text-gray-400 { color: #9ca3af !important; }
      .dark .text-gray-500 { color: #d1d5db !important; }
      .dark .text-gray-600 { color: #e5e7eb !important; }
      .dark .text-gray-700 { color: #f3f4f6 !important; }
      .dark .text-gray-800 { color: #f9fafb !important; }
      .dark .text-gray-900 { color: #ffffff !important; }
      .dark .text-slate-400 { color: #94a3b8 !important; }
      .dark .text-slate-500 { color: #cbd5e1 !important; }
      .dark .text-slate-600 { color: #e2e8f0 !important; }
      .dark .text-slate-700 { color: #f1f5f9 !important; }
      .dark .text-slate-800 { color: #f8fafc !important; }
      .dark .text-slate-900 { color: #ffffff !important; }
      /* Background color fixes for dark mode */
      .dark .bg-white { background-color: #1e293b !important; }
      .dark .bg-gray-50 { background-color: #1e293b !important; }
      .dark .bg-gray-100 { background-color: #334155 !important; }
      .dark .bg-slate-50 { background-color: #1e293b !important; }
      .dark .bg-slate-100 { background-color: #334155 !important; }
      /* Border color fixes for dark mode */
      .dark .border-gray-100 { border-color: #334155 !important; }
      .dark .border-gray-200 { border-color: #475569 !important; }
      .dark .border-gray-300 { border-color: #64748b !important; }
      .dark .border-slate-100 { border-color: #334155 !important; }
      .dark .border-slate-200 { border-color: #475569 !important; }
      .dark .border-slate-300 { border-color: #64748b !important; }
      /* Hover states for dark mode */
      .dark .hover\:bg-gray-50:hover { background-color: #334155 !important; }
      .dark .hover\:bg-gray-100:hover { background-color: #475569 !important; }
      .dark .hover\:bg-slate-50:hover { background-color: #334155 !important; }
      .dark .hover\:bg-slate-100:hover { background-color: #475569 !important; }
      /* Placeholder text for dark mode */
      .dark .placeholder-gray-400::placeholder { color: #9ca3af !important; }
      .dark .placeholder-gray-500::placeholder { color: #d1d5db !important; }
      .dark .placeholder-slate-400::placeholder { color: #94a3b8 !important; }
      /* Ring colors for dark mode focus states */
      .dark .ring-gray-200 { --tw-ring-color: #475569 !important; }
      .dark .ring-slate-200 { --tw-ring-color: #475569 !important; }
      /* Divide colors for dark mode */
      .dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color: #334155 !important; }
      .dark .divide-gray-200 > :not([hidden]) ~ :not([hidden]) { border-color: #475569 !important; }
      .dark .divide-slate-100 > :not([hidden]) ~ :not([hidden]) { border-color: #334155 !important; }
      .dark .divide-slate-200 > :not([hidden]) ~ :not([hidden]) { border-color: #475569 !important; }
    </style>
  </head>
  <body class="bg-surface-50 dark:bg-surface-950 text-surface-900 dark:text-surface-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
