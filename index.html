<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ComplyEasy AI - Compliance Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
                950: '#042f2e',
              },
              accent: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              },
              surface: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              }
            },
            animation: {
              'fadeIn': 'fadeIn 0.3s ease-out',
              'fadeInUp': 'fadeInUp 0.5s ease-out',
              'fadeInDown': 'fadeInDown 0.4s ease-out',
              'slideInLeft': 'slideInLeft 0.3s ease-out',
              'slideInRight': 'slideInRight 0.3s ease-out',
              'scaleIn': 'scaleIn 0.2s ease-out',
              'confetti-fall': 'confettiFall 3s ease-in forwards',
              'checkmark-draw': 'checkmarkDraw 0.6s ease-out 0.3s forwards',
              'onboarding-modal-in': 'onboardingModalIn 0.3s ease-out',
              'onboarding-slide-up': 'onboardingSlideUp 0.25s ease-out',
              'pulse-slow': 'pulse 4s ease-in-out infinite',
              'pulse-slow-delay': 'pulse 4s ease-in-out 2s infinite',
              'shimmer': 'shimmer 2s linear infinite',
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
              'gradient': 'gradient 8s ease infinite',
              'spin-slow': 'spin 3s linear infinite',
              'count-up': 'countUp 1s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInDown: {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideInLeft: {
                '0%': { opacity: '0', transform: 'translateX(-20px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              slideInRight: {
                '0%': { opacity: '0', transform: 'translateX(20px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              confettiFall: {
                '0%': { transform: 'translateY(0) rotate(0deg)', opacity: '1' },
                '100%': { transform: 'translateY(100vh) rotate(720deg)', opacity: '0' },
              },
              checkmarkDraw: {
                '0%': { strokeDashoffset: '24' },
                '100%': { strokeDashoffset: '0' },
              },
              onboardingModalIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              onboardingSlideUp: {
                '0%': { opacity: '0', transform: 'translateY(8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              glow: {
                '0%': { boxShadow: '0 0 20px rgba(13, 148, 136, 0.2)' },
                '100%': { boxShadow: '0 0 40px rgba(13, 148, 136, 0.4)' },
              },
              gradient: {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              countUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
            backgroundSize: {
              '300%': '300%',
            },
            backdropBlur: {
              xs: '2px',
            },
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.3);
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.5);
      }
      /* Gradient text utility */
      .text-gradient {
        background: linear-gradient(135deg, #0d9488 0%, #06b6d4 50%, #22d3ee 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .text-gradient-accent {
        background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      /* Glass morphism */
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .glass-dark {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      /* Mesh gradient background */
      .mesh-gradient {
        background:
          radial-gradient(at 40% 20%, rgba(13, 148, 136, 0.15) 0px, transparent 50%),
          radial-gradient(at 80% 0%, rgba(6, 182, 212, 0.1) 0px, transparent 50%),
          radial-gradient(at 0% 50%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
          radial-gradient(at 80% 50%, rgba(13, 148, 136, 0.08) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      }
      /* Noise texture overlay */
      .noise::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 1;
      }
      /* Dot pattern */
      .dot-pattern {
        background-image: radial-gradient(circle, rgba(13, 148, 136, 0.1) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      /* Ring chart */
      .ring-chart {
        transform: rotate(-90deg);
      }
      .ring-chart-label {
        transform: rotate(90deg);
      }
      /* Dark mode mesh gradient */
      .dark .mesh-gradient {
        background:
          radial-gradient(at 40% 20%, rgba(13, 148, 136, 0.25) 0px, transparent 50%),
          radial-gradient(at 80% 0%, rgba(6, 182, 212, 0.2) 0px, transparent 50%),
          radial-gradient(at 0% 50%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
          radial-gradient(at 80% 50%, rgba(13, 148, 136, 0.15) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(6, 182, 212, 0.2) 0px, transparent 50%);
      }
      /* Dark mode dot pattern */
      .dark .dot-pattern {
        background-image: radial-gradient(circle, rgba(13, 148, 136, 0.2) 1px, transparent 1px);
      }
      /* Dark mode scrollbar */
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.4);
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.6);
      }
      /* Transition for theme changes */
      html {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* ======================================
         DARK MODE TEXT COLOR OVERRIDES
         Ensures readability when dark mode is enabled
         ====================================== */
      .dark .text-gray-400 { color: #9ca3af !important; }
      .dark .text-gray-500 { color: #d1d5db !important; }
      .dark .text-gray-600 { color: #e5e7eb !important; }
      .dark .text-gray-700 { color: #f3f4f6 !important; }
      .dark .text-gray-800 { color: #f9fafb !important; }
      .dark .text-gray-900 { color: #ffffff !important; }
      .dark .text-slate-400 { color: #94a3b8 !important; }
      .dark .text-slate-500 { color: #cbd5e1 !important; }
      .dark .text-slate-600 { color: #e2e8f0 !important; }
      .dark .text-slate-700 { color: #f1f5f9 !important; }
      .dark .text-slate-800 { color: #f8fafc !important; }
      .dark .text-slate-900 { color: #ffffff !important; }
      /* Background color fixes for dark mode */
      .dark .bg-white { background-color: #1e293b !important; }
      .dark .bg-gray-50 { background-color: #1e293b !important; }
      .dark .bg-gray-100 { background-color: #334155 !important; }
      .dark .bg-slate-50 { background-color: #1e293b !important; }
      .dark .bg-slate-100 { background-color: #334155 !important; }
      /* Border color fixes for dark mode */
      .dark .border-gray-100 { border-color: #334155 !important; }
      .dark .border-gray-200 { border-color: #475569 !important; }
      .dark .border-gray-300 { border-color: #64748b !important; }
      .dark .border-slate-100 { border-color: #334155 !important; }
      .dark .border-slate-200 { border-color: #475569 !important; }
      .dark .border-slate-300 { border-color: #64748b !important; }
      /* Hover states for dark mode */
      .dark .hover\:bg-gray-50:hover { background-color: #334155 !important; }
      .dark .hover\:bg-gray-100:hover { background-color: #475569 !important; }
      .dark .hover\:bg-slate-50:hover { background-color: #334155 !important; }
      .dark .hover\:bg-slate-100:hover { background-color: #475569 !important; }
      /* Placeholder text for dark mode */
      .dark .placeholder-gray-400::placeholder { color: #9ca3af !important; }
      .dark .placeholder-gray-500::placeholder { color: #d1d5db !important; }
      .dark .placeholder-slate-400::placeholder { color: #94a3b8 !important; }
      /* Ring colors for dark mode focus states */
      .dark .ring-gray-200 { --tw-ring-color: #475569 !important; }
      .dark .ring-slate-200 { --tw-ring-color: #475569 !important; }
      /* Divide colors for dark mode */
      .dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color: #334155 !important; }
      .dark .divide-gray-200 > :not([hidden]) ~ :not([hidden]) { border-color: #475569 !important; }
      .dark .divide-slate-100 > :not([hidden]) ~ :not([hidden]) { border-color: #334155 !important; }
      .dark .divide-slate-200 > :not([hidden]) ~ :not([hidden]) { border-color: #475569 !important; }
    </style>
  </head>
  <body class="bg-surface-50 dark:bg-surface-950 text-surface-900 dark:text-surface-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
